<!-- @dsCard group="Components" viewport="700x430" name="Primitives" subtitle="Button · Badge · Dot · TextInput · Sparkline" -->
<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../../styles.css"/>
<script src="../../foundations.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../comp_atoms.jsx"></script>
<style>
  body { margin:0; background:var(--surface); padding:22px; }
  .grid { display:flex; flex-direction:column; gap:20px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .lbl { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .box { border:1px solid var(--line-2); border-radius:14px; padding:16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { WebButton, WebBadge, WebDot, WebTextInput, WebSparkline } = window;
function Card(){
  return (
    <div className="grid">
      <div>
        <div className="lbl">Button · intent + state</div>
        <div className="row">
          <WebButton size="sm">Primary</WebButton>
          <WebButton size="sm" variant="pos">Авах</WebButton>
          <WebButton size="sm" variant="neg">Зарах</WebButton>
          <WebButton size="sm" variant="ink">Ink</WebButton>
          <WebButton size="sm" variant="ghost">Ghost</WebButton>
          <WebButton size="sm" pill>Pill</WebButton>
          <WebButton size="sm" disabled>Disabled</WebButton>
        </div>
      </div>
      <div className="row" style={{alignItems:'flex-start'}}>
        <div style={{flex:'1 1 200px'}}>
          <div className="lbl">Badge · one tone per meaning</div>
          <div className="row">
            <WebBadge tone="new">Шинэ</WebBadge>
            <WebBadge tone="active">Идэвхтэй</WebBadge>
            <WebBadge tone="buy">Авах</WebBadge>
            <WebBadge tone="sell">Зарах</WebBadge>
            <WebBadge tone="info">Мэдээлэл</WebBadge>
          </div>
          <div className="lbl" style={{marginTop:18}}>Dot + Sparkline</div>
          <div className="row">
            <span style={{display:'flex',alignItems:'center',gap:6,fontSize:13,fontWeight:600,color:'var(--text)'}}><WebDot color="var(--pos)"/>Өсөлт</span>
            <WebSparkline data={[3,5,4,7,6,9,8,11]} color="var(--pos)" width={110}/>
          </div>
        </div>
        <div style={{flex:'1 1 240px'}}>
          <div className="lbl">TextInput</div>
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            <WebTextInput label="Утасны дугаар" placeholder="99xxxxxx"/>
            <WebTextInput label="Дүн" mono prefix="₮" placeholder="0" error="Үлдэгдэл хүрэлцэхгүй байна"/>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
