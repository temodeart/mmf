<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 · 48 — nothing off-scale" -->
<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:20px;}
  .item{text-align:center;}
  .bar{background:var(--indigo-soft);border:1px solid var(--indigo-border);border-radius:6px;}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:8px;}
  .val{font-size:11px;font-weight:800;color:var(--ink);margin-top:2px;}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="bar" style="width:4px;height:4px"></div><div class="tok">s-1</div><div class="val">4</div></div>
  <div class="item"><div class="bar" style="width:8px;height:8px"></div><div class="tok">s-2</div><div class="val">8</div></div>
  <div class="item"><div class="bar" style="width:12px;height:12px"></div><div class="tok">s-3</div><div class="val">12</div></div>
  <div class="item"><div class="bar" style="width:16px;height:16px"></div><div class="tok">s-4</div><div class="val">16</div></div>
  <div class="item"><div class="bar" style="width:24px;height:24px"></div><div class="tok">s-5</div><div class="val">24</div></div>
  <div class="item"><div class="bar" style="width:32px;height:32px"></div><div class="tok">s-6</div><div class="val">32</div></div>
  <div class="item"><div class="bar" style="width:48px;height:48px"></div><div class="tok">s-7</div><div class="val">48</div></div>
</div>
</body></html>
