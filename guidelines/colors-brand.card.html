<!-- @dsCard group="Colors" viewport="700x180" name="Brand" subtitle="Indigo primary · Blue accent · Orange · Navy" -->
<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface);padding:22px;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .sw{border-radius:14px;overflow:hidden;border:1px solid var(--line-2);}
  .chip{height:76px;}
  .meta{padding:10px 12px;}
  .nm{font-size:12.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:3px;}
  .use{font-size:10.5px;color:var(--muted-2);font-weight:600;margin-top:2px;}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--indigo)"></div><div class="meta"><div class="nm">Indigo</div><div class="hex">#4F46E5</div><div class="use">Primary action</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--blue)"></div><div class="meta"><div class="nm">Blue</div><div class="hex">#2D6BFF</div><div class="use">Accent · charts</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--orange)"></div><div class="meta"><div class="nm">Orange</div><div class="hex">#FF6B2C</div><div class="use">Progress · dot only</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--navy)"></div><div class="meta"><div class="nm">Navy</div><div class="hex">#050B1F</div><div class="use">Hero surfaces</div></div></div>
</div>
</body></html>
