<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface);padding:24px;}
  .row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;}
  .item{text-align:center;}
  .sq{width:64px;height:64px;background:var(--indigo-soft);border:1.5px solid var(--indigo-border);}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:8px;}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="sq" style="border-radius:var(--r-2)"></div><div class="tok">r-2 · 8</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-4)"></div><div class="tok">r-4 · 12</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-5)"></div><div class="tok">r-5 · 14</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-6)"></div><div class="tok">r-6 · 16</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-8)"></div><div class="tok">r-8 · 22</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-9)"></div><div class="tok">r-9 · 28</div></div>
  <div class="item"><div class="sq" style="border-radius:var(--r-pill)"></div><div class="tok">pill · 999</div></div>
</div>
</body></html>
