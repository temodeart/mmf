<!-- @dsCard group="Colors" viewport="700x200" name="Hero surfaces" subtitle="Navy→indigo · pastel onboarding · promo gradients" -->
<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface);padding:22px;}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .hero{height:120px;border-radius:18px;position:relative;overflow:hidden;padding:16px;color:#fff;}
  .orb{position:absolute;width:120px;height:120px;border-radius:50%;filter:blur(6px);opacity:.55;}
  .cap{font-size:11px;font-weight:700;color:var(--muted);margin-top:10px;text-align:center;}
  .nm{font-size:13px;font-weight:800;letter-spacing:-.01em;position:relative;z-index:1;}
</style></head>
<body>
<div class="row">
  <div>
    <div class="hero" style="background:var(--hero-navy)"><div class="orb" style="background:var(--orange);right:-40px;bottom:-40px;"></div><div class="nm">Portfolio hero</div></div>
    <div class="cap">--hero-navy</div>
  </div>
  <div>
    <div class="hero" style="background:var(--hero-pastel)"><div class="nm" style="color:var(--indigo)">Onboarding visual</div></div>
    <div class="cap">--hero-pastel</div>
  </div>
  <div>
    <div class="hero" style="background:var(--hero-promo)"><div class="nm" style="color:var(--indigo)">Тун удахгүй</div></div>
    <div class="cap">--hero-promo</div>
  </div>
</div>
</body></html>
