document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

wash */\n  --surface:        #FFFFFF;   /* default card surface */\n  --ink:            #0B1020;   /* primary text */\n  --ink-2:          #1F2540;\n  --text:           #2A3052;   /* body text */\n  --muted:          #6B7191;   /* labels, secondary text */\n  --muted-2:        #6E7492;   /* placeholders, tertiary — R11: darkened from #9099B5 (2.8:1) to 4.6:1 on white, AA-passing for date stamps/meta text */\n  --line:           #E7E9F2;   /* card borders, dividers */\n  --line-2:         #EFF1F8;   /* internal separators */\n  --field-bg:       #FAFBFE;   /* resting input fill */\n\n  /* -------- TYPOGRAPHY -------- */\n  --font-ui:        'Manrope', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;\n  --font-mono:      'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* Type scale (px) */\n  --t-display:      44px;   /* splash hero, big numbers */\n  --t-title:        30px;   /* onboarding titles */\n  --t-h1:           28px;   /* page titles */\n  --t-h2:           22px;   /* section titles inside screens */\n  --t-h3:           18px;   /* card titles */\n  --t-h4:           16px;   /* section labels */\n  --t-body-lg:      15px;   /* primary body */\n  --t-body:         14px;   /* default body */\n  --t-sm:           13px;   /* card body */\n  --t-xs:           12px;   /* labels */\n  --t-2xs:          11px;   /* meta */\n  --t-3xs:          10px;   /* eyebrows */\n\n  /* Weights */\n  --fw-regular:     400;\n  --fw-medium:      500;\n  --fw-semibold:    600;\n  --fw-bold:        700;\n  --fw-black:       800;\n\n  /* Letter spacing */\n  --ls-display:     -0.02em;\n  --ls-title:       -0.02em;\n  --ls-h:           -0.01em;\n  --ls-body:        0;\n  --ls-eyebrow:     0.08em;\n  --ls-eyebrow-lg:  0.18em;\n\n  /* -------- SPACING SCALE -------- */\n  --s-1:            4px;\n  --s-2:            8px;\n  --s-3:            12px;\n  --s-4:            16px;\n  --s-5:            24px;\n  --s-6:            32px;\n  --s-7:            48px;\n  --margin-h:       24px;   /* mobile horizontal margin */\n  --card-pad:       20px;   /* default card padding */\n  --tabbar-h:       80px;   /* bottom tab bar height incl. safe area */\n\n  /* -------- RADII -------- */\n  --r-1:            6px;    /* checkbox glyph */\n  --r-2:            8px;    /* small chip */\n  --r-3:            10px;   /* badge, icon container */\n  --r-4:            12px;   /* button-small, chip */\n  --r-5:            14px;   /* button, input */\n  --r-6:            16px;   /* card */\n  --r-7:            18px;   /* card */\n  --r-8:            22px;   /* hero card */\n  --r-9:            28px;   /* large hero / device frame */\n  --r-frame:        48px;   /* device frame outer */\n  --r-pill:         999px;\n\n  /* -------- SHADOWS -------- */\n  --shadow-frame:   0 30px 60px -25px rgba(15,20,55,.18),\n                    0 8px 20px -10px rgba(15,20,55,.08);\n  --shadow-card:    0 2px 6px -2px rgba(15,20,55,.04);\n  --shadow-cta:     0 8px 22px -8px rgba(79,70,229,.5);\n  --shadow-floating:0 10px 30px -10px rgba(15,20,55,.25);\n  --shadow-press:   0 1px 3px rgba(15,20,55,.06);\n  --ring-focus:     0 0 0 4px var(--indigo-soft);\n\n  /* Focus ring (F-24) — one global :focus-visible outline: 2px indigo, 2px offset */\n  --focus-ring-color:  var(--indigo);\n  --focus-ring-w:      2px;\n  --focus-ring-offset: 2px;\n\n  /* -------- MOTION -------- */\n  --ease-default:   cubic-bezier(.2,.8,.2,1);\n  --t-fast:         0.15s;\n  --t-medium:       0.2s;\n  --t-slow:         0.35s;\n\n  /* -------- HERO GRADIENTS -------- */\n  --hero-navy:      linear-gradient(135deg, #050B1F 0%, #4F46E5 130%);\n  --hero-pastel:    linear-gradient(160deg, #EEF0FE 0%, #E7EEFF 60%, #F4F6FA 100%);\n  --hero-promo:     linear-gradient(140deg, #FFFFFF 0%, #F4F1FF 60%, #EEF0FE 100%);\n  --bar-orange:     linear-gradient(90deg, #FF6B2C, #FF8B4F);\n\n  /* -------- SEMANTIC ROLE ALIASES (brief 00) -------- */\n  /* All passes use --pos / --neg / --warn / --info — never ad-hoc colors */\n  --pos:             #0E9F6E;   /* авах · ашиг · баталгаажсан */\n  --pos-soft:        #E3F5EE;\n  --pos-border:      #BFE9D8;\n  --neg:             #DC2626;   /* зарах · алдагдал · алдаа */\n  --neg-soft:        #FDECEC;\n  --neg-border:      #F5C9C9;\n  --warn:            #B7791F;   /* хүлээгдэж буй · анхааруулга */\n  --warn-soft:       #FFF3D6;\n  --warn-border:     #FFE9C4;\n  --warn-surface:    #FFFBF2;\n  /* --info / --info-soft already wired above via var(--indigo) */\n\n  /* -------- DESKTOP LAYOUT -------- */\n  --sidebar-w:       268px;     /* left navigation rail */\n  --topbar-h:        72px;      /* sticky top bar */\n  --content-pad-x:   36px;      /* main content horizontal padding */\n  --content-pad-y:   30px;      /* main content top padding */\n  --rail-w:          384px;     /* order-ticket / detail right rail */\n  --app-rail:        320px;     /* F-01 · fixed side column in fluid app content grid */\n\n  /* -------- ELEVATION -------- */\n  --e-1:            0 1px 3px rgba(15,20,55,.06);\n  --e-2:            0 2px 8px -2px rgba(15,20,55,.10);\n  --e-3:            0 8px 24px -8px rgba(15,20,55,.18);\n  --e-4:            0 24px 60px -16px rgba(15,20,55,.28);\n\n  /* -------- A11Y -------- */\n  --target-min:      40px;      /* minimum tap/click target height */\n}\n\n/* =========================================================================\n   SEMANTIC ELEMENT RULES\n   Apply these by including this stylesheet on any HTML doc.\n   ========================================================================= */\n\nhtml, body {\n  margin: 0;\n  font-family: var(--font-ui);\n  background: var(--bg);\n  color: var(--ink);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n* { box-sizing: border-box; }\n\n/* SVG icons: brand default = 2px rounded stroke */\nsvg.icon, .icon svg {\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}\n\n/* Display / hero numbers */\n.display, h1.display {\n  font-size: var(--t-display);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--ls-display);\n  line-height: 1.05;\n  color: var(--ink);\n}\n\nh1, .h1 {\n  font-size: var(--t-h1);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--ls-title);\n  line-height: 1.1;\n  margin: 0;\n  color: var(--ink);\n}\n\nh2, .h2 {\n  font-size: var(--t-h2);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--ls-title);\n  line-height: 1.15;\n  margin: 0;\n  color: var(--ink);\n}\n\nh3, .h3 {\n  font-size: var(--t-h3);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-h);\n  line-height: 1.25;\n  margin: 0;\n  color: var(--ink);\n}\n\nh4, .h4 {\n  font-size: var(--t-h4);\n  font-weight: var(--fw-black);\n  letter-spacing: var(--ls-h);\n  margin: 0;\n  color: var(--ink);\n}\n\np, .body {\n  font-size: var(--t-body);\n  font-weight: var(--fw-medium);\n  line-height: 1.5;\n  color: var(--text);\n  margin: 0;\n}\n\n.body-lg { font-size: var(--t-body-lg); line-height: 1.55; color: var(--muted); }\n.body-sm { font-size: var(--t-sm); line-height: 1.5; color: var(--text); }\n\n.eyebrow {\n  font-size: var(--t-xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-eyebrow-lg);\n  text-transform: uppercase;\n  color: var(--indigo);\n}\n\n.label {\n  font-size: var(--t-xs);\n  font-weight: var(--fw-semibold);\n  color: var(--muted);\n}\n\n.meta {\n  font-size: var(--t-2xs);\n  font-weight: var(--fw-semibold);\n  color: var(--muted-2);\n}\n\n.mono, code, kbd, .ticker {\n  font-family: var(--font-mono);\n  font-variant-numeric: tabular-nums;\n}\n\n.num, .amount, .currency {\n  font-variant-numeric: tabular-nums;\n  letter-spacing: var(--ls-h);\n}\n\n/* =========================================================================\n   COMPONENT BASELINES\n   ========================================================================= */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--line-2);\n  border-radius: var(--r-7);\n  padding: var(--card-pad);\n}\n\n.card--hero {\n  border: none;\n  border-radius: var(--r-8);\n  color: #fff;\n  background: var(--hero-navy);\n  position: relative;\n  overflow: hidden;\n}\n\n.btn {\n  height: 52px;\n  padding: 0 22px;\n  border-radius: var(--r-5);\n  font-family: inherit;\n  font-weight: var(--fw-bold);\n  font-size: var(--t-body-lg);\n  letter-spacing: var(--ls-h);\n  border: none;\n  cursor: pointer;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  transition: opacity var(--t-fast), box-shadow var(--t-fast);\n}\n.btn:active { opacity: 0.92; }\n.btn--primary {\n  background: var(--indigo);\n  color: #fff;\n  box-shadow: var(--shadow-cta);\n}\n.btn--ink     { background: var(--ink); color: #fff; }\n.btn--ghost   {\n  background: transparent;\n  color: var(--ink);\n  border: 1.5px solid var(--line);\n}\n.btn--pill    { border-radius: var(--r-pill); }\n.btn--sm      { height: 36px; padding: 0 16px; font-size: var(--t-sm); border-radius: var(--r-4); }\n.btn--full    { width: 100%; }\n\n.input {\n  height: 52px;\n  border-radius: var(--r-5);\n  background: var(--field-bg);\n  border: 1.5px solid var(--line);\n  padding: 0 16px;\n  font-family: inherit;\n  font-size: var(--t-body-lg);\n  font-weight: var(--fw-medium);\n  color: var(--ink);\n  width: 100%;\n  transition: border-color var(--t-fast), box-shadow var(--t-fast), background var(--t-fast);\n}\n.input:focus, .input.is-focused {\n  outline: none;\n  background: var(--surface);\n  border-color: var(--indigo);\n  box-shadow: var(--ring-focus);\n}\n.input::placeholder { color: var(--muted-2); }\n\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  padding: 4px 10px;\n  border-radius: var(--r-pill);\n  font-size: var(--t-2xs);\n  font-weight: var(--fw-bold);\n  letter-spacing: 0.01em;\n}\n.badge::before {\n  content: '';\n  width: 6px; height: 6px; border-radius: 50%;\n  background: currentColor;\n  opacity: 0.85;\n}\n.badge--new    { background: var(--green-soft);  color: var(--green); }\n.badge--active { background: var(--amber-soft);  color: var(--amber); }\n.badge--sell   { background: var(--red-soft);    color: var(--red); }\n.badge--buy    { background: var(--blue-soft);   color: var(--blue); }\n.badge--info   { background: var(--indigo-soft); color: var(--indigo); }\n\n/* =========================================================================\n   FOCUS RING — :focus-visible on all interactive elements (WCAG AA)\n   ========================================================================= */\n\na:focus-visible,\nbutton:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible,\n[tabindex]:focus-visible,\n[role=\"row\"]:focus-visible,\ntr:focus-visible,\n[role=\"button\"]:focus-visible,\n[role=\"option\"]:focus-visible,\n[role=\"menuitem\"]:focus-visible,\n.sort-btn:focus-visible,\n.page-size:focus-visible,\n.dropdown-item:focus-visible {\n  outline: var(--focus-ring-w) solid var(--focus-ring-color);\n  outline-offset: var(--focus-ring-offset);\n  box-shadow: none;\n  border-radius: var(--r-4);\n}\n\n/* =========================================================================\n   MIN TARGET — interactive elements ≥ 40 px (brief 00)\n   ========================================================================= */\n\nbutton,\n[role=\"button\"],\n[role=\"tab\"],\n[role=\"option\"],\n[role=\"menuitem\"] {\n  min-height: var(--target-min);\n}\n\n/* =========================================================================\n   SKELETON — shimmer loading placeholder\n   ========================================================================= */\n\n@keyframes skeleton-shimmer {\n  0%   { background-position: 200% 0; }\n  100% { background-position: -200% 0; }\n}\n\n.skeleton {\n  display: block;\n  background: linear-gradient(\n    90deg,\n    var(--line-2) 0%,\n    var(--line)  40%,\n    var(--line-2) 60%,\n    var(--line-2) 100%\n  );\n  background-size: 200% 100%;\n  animation: skeleton-shimmer 1.6s ease-in-out infinite;\n  border-radius: var(--r-2);\n  color: transparent !important;\n  user-select: none;\n  pointer-events: none;\n}\n\n.skeleton--text   { height: 14px; border-radius: var(--r-1); }\n.skeleton--title  { height: 22px; border-radius: var(--r-1); }\n.skeleton--num    { height: 32px; border-radius: var(--r-1); min-width: 80px; }\n.skeleton--avatar { width: 44px; height: 44px; border-radius: var(--r-3); flex-shrink: 0; }\n.skeleton--card   { height: 120px; border-radius: var(--r-6); }\n.skeleton--row    { height: 52px; border-radius: var(--r-2); }\n\n@media (prefers-reduced-motion: reduce) {\n  .skeleton { animation: none; background: var(--line-2); }\n}\n\n/* =========================================================================\n   EMPTY STATE\n   ========================================================================= */\n\n.empty-state {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  text-align: center;\n  padding: var(--s-7) var(--s-5);\n  gap: var(--s-3);\n}\n\n.empty-state__icon {\n  width: 56px;\n  height: 56px;\n  border-radius: var(--r-5);\n  background: var(--line-2);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  margin-bottom: var(--s-2);\n}\n\n.empty-state__title {\n  font-size: var(--t-h4);\n  font-weight: var(--fw-bold);\n  letter-spacing: var(--ls-h);\n  color: var(--ink);\n  margin: 0;\n}\n\n.empty-state__body {\n  font-size: var(--t-sm);\n  font-weight: var(--fw-medium);\n  color: var(--muted);\n  line-height: 1.55;\n  max-width: 300px;\n  margin: 0;\n}\n\n/* =========================================================================\n   ERROR / ALERT STATE  — neg · warn · info variants\n   ========================================================================= */\n\n.error-state {\n  display: flex;\n  gap: var(--s-3);\n  padding: var(--s-4);\n  border-radius: var(--r-5);\n  background: var(--neg-soft);\n  border: 1px solid var(--neg-border);\n  align-items: flex-start;\n}\n\n.error-state__icon {\n  width: 36px;\n  height: 36px;\n  border-radius: var(--r-3);\n  background: var(--neg);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  flex-shrink: 0;\n}\n\n.error-state__title {\n  font-size: var(--t-body);\n  font-weight: var(--fw-bold);\n  color: var(--neg);\n  margin: 0 0 2px;\n}\n\n.error-state__body {\n  font-size: var(--t-sm);\n  font-weight: var(--fw-medium);\n  color: var(--text);\n  line-height: 1.5;\n  margin: 0;\n}\n\n.error-state--warn {\n  background: var(--warn-surface);\n  border-color: var(--warn-border);\n}\n.error-state--warn .error-state__icon  { background: var(--warn); }\n.error-state--warn .error-state__title { color: var(--warn); }\n\n.error-state--info {\n  background: var(--info-soft);\n  border-color: var(--indigo-soft);\n}\n.error-state--info .error-state__icon  { background: var(--info); }\n.error-state--info .error-state__title { color: var(--info); }\n\n/* =========================================================================\n   F-01 · FLUID APP CONTENT GRID\n   main column + fixed 320px rail; every child gets min-width:0 so long\n   labels truncate instead of forcing horizontal overflow.\n   Test widths: 1280 / 1366 / 1440 / 1600 / 1920.\n   ========================================================================= */\n.app-grid {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) var(--app-rail);\n  gap: var(--s-5);\n  align-items: start;\n}\n.app-grid > * { min-width: 0; }                 /* every child may shrink */\n.truncate { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n\n/* =========================================================================\n   F-06 · ISSUER LOGO CONTAINER\n   1:1 plate · object-fit:contain · 6px padding · neutral #F4F6FA · 8px radius.\n   ========================================================================= */\n.issuer-logo {\n  aspect-ratio: 1 / 1; width: 40px; padding: 6px;\n  background: var(--bg); border-radius: var(--r-2);\n  display: flex; align-items: center; justify-content: center; flex-shrink: 0;\n}\n.issuer-logo > img, .issuer-logo > svg { width: 100%; height: 100%; object-fit: contain; }\n\n/* =========================================================================\n   F-07 · EXTERNAL LINK\n   Always https:// · target=\"_blank\" rel=\"noopener noreferrer\" · trailing arrow.\n   ========================================================================= */\n.ext-link { display: inline-flex; align-items: center; gap: 4px; color: var(--indigo); font-weight: var(--fw-semibold); text-decoration: none; }\n.ext-link:hover { text-decoration: underline; }\n.ext-link__icon { width: 12px; height: 12px; flex-shrink: 0; stroke: currentColor; }\n\n/* =========================================================================\n   a11y §06 · NON-COLOR DIRECTION CUE\n   Авах / Зарах always carry color + text label AND an arrow icon.\n   ========================================================================= */\n.dir { display: inline-flex; align-items: center; gap: 5px; font-weight: var(--fw-bold); font-size: var(--t-sm); letter-spacing: var(--ls-h); }\n.dir__arrow { width: 12px; height: 12px; flex-shrink: 0; }\n.dir--buy  { color: var(--pos); }\n.dir--sell { color: var(--neg); }\n\n/* Shared tabular-numeral utility — pair with mono font-family where needed */\n.num { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }\n\n/* =========================================================================\n   F-24 · SKIP-TO-CONTENT LINK — visible only on keyboard focus, top-left\n   ========================================================================= */\n.skip-link {\n  position: fixed; top: 12px; left: 12px; z-index: 100;\n  transform: translateY(-160%);\n  background: var(--indigo); color: #fff;\n  padding: 10px 16px; border-radius: var(--r-4);\n  font-weight: 700; font-size: 13px; text-decoration: none;\n  box-shadow: var(--e-3);\n  transition: transform .18s var(--ease-default);\n}\n.skip-link:focus {\n  transform: translateY(0);\n  outline: var(--focus-ring-w) solid var(--focus-ring-color);\n  outline-offset: var(--focus-ring-offset);\n}\n\n/* =========================================================================\n   R11 · SCREEN-READER-ONLY UTILITY — for aria-live status regions etc.\n   Dev note: pair with a fixed, per-page aria-live=\"polite\" region (see\n   WebAppShell) so route/tab changes and 3–5s loading states get announced;\n   in a real app, update its text node on each navigation/data-load event.\n   ========================================================================= */\n.sr-only {\n  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;\n  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;\n}\n\n/* =========================================================================\n   DROPDOWN MENU ITEM — base row for avatar / overflow menus (F-24 ring auto)\n   ========================================================================= */\n.dropdown-item {\n  display: flex; align-items: center; gap: 10px; width: 100%;\n  padding: 10px 12px; border: none; background: transparent;\n  border-radius: var(--r-3); font-family: inherit; font-size: 13.5px;\n  font-weight: 600; color: var(--text); cursor: pointer; text-align: left;\n  min-height: 0;\n}\n.dropdown-item:hover { background: var(--indigo-soft); color: var(--indigo); }\n<\u002Fstyle>\n<style>/* ═══════════════════════════════════════════════════════════════\n   MMF — Landing 13 · App First\n   Sections, motion, layout. Brand tokens come from colors_and_type.css\n   ═══════════════════════════════════════════════════════════════ */\n\n:root {\n  --accent: var(--indigo);\n  --accent-soft: var(--indigo-soft);\n  --wrap: 1240px;\n  --nav-h: 76px;\n}\n\nhtml { scroll-behavior: smooth; }\nbody.laf {\n  background: #FDFDFF;\n  color: var(--ink);\n  overflow-x: hidden;\n}\n\na { color: var(--accent); text-decoration: none; }\na:hover { color: var(--navy); }\n\n::selection { background: var(--accent-soft); color: var(--accent); }\n\n.laf-wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 40px; }\n\n/* ---------- Type ---------- */\n.laf-display {\n  font-size: clamp(46px, 6.2vw, 92px);\n  font-weight: 800;\n  letter-spacing: -0.035em;\n  line-height: 0.98;\n  color: var(--ink);\n  margin: 0;\n  text-wrap: balance;\n}\n.laf-h2 {\n  font-size: clamp(34px, 3.8vw, 56px);\n  font-weight: 800;\n  letter-spacing: -0.03em;\n  line-height: 1.04;\n  margin: 0;\n  color: var(--ink);\n  text-wrap: balance;\n}\n.laf-eyebrow {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-family: var(--font-mono);\n  font-size: 12px; font-weight: 600;\n  letter-spacing: 0.16em; text-transform: uppercase;\n  color: var(--accent);\n}\n.laf-eyebrow::before {\n  content: ''; width: 22px; height: 2px; background: var(--accent); border-radius: 2px;\n}\n.laf-sub {\n  font-size: 17px; font-weight: 500; line-height: 1.65;\n  color: var(--muted); max-width: 520px;\n}\n\n/* ---------- Buttons ---------- */\n.laf-btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 10px;\n  height: 56px; padding: 0 28px; border-radius: var(--r-pill);\n  font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: -0.01em;\n  border: none; cursor: pointer; white-space: nowrap;\n  transition: transform var(--t-medium) var(--ease-default),\n              box-shadow var(--t-medium) var(--ease-default),\n              background var(--t-fast), color var(--t-fast), border-color var(--t-fast);\n}\n.laf-btn--primary { background: var(--accent); color: #fff; box-shadow: 0 8px 22px -8px color-mix(in oklab, var(--accent) 55%, transparent); }\n.laf-btn--primary:hover { color:#fff; transform: translateY(-2px); box-shadow: 0 14px 30px -10px color-mix(in oklab, var(--accent) 60%, transparent); }\n.laf-btn--ink { background: var(--ink); color: #fff; }\n.laf-btn--ink:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 14px 28px -12px rgba(11,16,32,.5); }\n.laf-btn--ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }\n.laf-btn--ghost:hover { color: var(--ink); border-color: var(--ink); }\n.laf-btn--glass { background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(8px); }\n.laf-btn--glass:hover { color:#fff; background: rgba(255,255,255,.14); }\n.laf-btn--white { background: #fff; color: var(--ink); box-shadow: 0 12px 28px -12px rgba(0,0,0,.5); }\n.laf-btn--white:hover { color: var(--ink); transform: translateY(-2px); }\n.laf-btn--sm { height: 42px; padding: 0 20px; font-size: 13.5px; }\n\n/* ---------- Nav ---------- */\n.laf-nav {\n  position: fixed; inset: 0 0 auto 0; z-index: 60; height: var(--nav-h);\n  display: flex; align-items: center;\n  background: rgba(253,253,255,.82);\n  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);\n  border-bottom: 1px solid transparent;\n  transition: border-color var(--t-medium), background var(--t-medium);\n}\n.laf-nav.is-scrolled { border-bottom-color: var(--line-2); }\n.laf-nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 32px; width: 100%; }\n.laf-logo img { height: 30px; display: block; }\n.laf-nav-links { display: flex; gap: 6px; }\n.laf-nav-links a {\n  padding: 9px 12px; border-radius: var(--r-pill); white-space: nowrap;\n  font-size: 14px; font-weight: 600; color: var(--text);\n  transition: background var(--t-fast), color var(--t-fast);\n}\n.laf-nav-links a:hover { background: var(--accent-soft); color: var(--accent); }\n.laf-nav-cta { display: flex; gap: 10px; align-items: center; }\n\n/* ---------- Hero ---------- */\n.laf-hero {\n  position: relative;\n  padding: calc(var(--nav-h) + 56px) 0 0;\n  min-height: 100svh;\n  display: flex; align-items: stretch;\n  overflow: hidden;\n}\n.laf-hero::before {\n  content: ''; position: absolute; inset: 0; pointer-events: none;\n  background:\n    radial-gradient(640px 480px at 82% 18%, rgba(79,70,229,.07), transparent 70%),\n    radial-gradient(520px 420px at 90% 85%, rgba(255,107,44,.06), transparent 70%),\n    radial-gradient(560px 460px at 8% 90%, rgba(45,107,255,.05), transparent 70%);\n}\n.laf-hero-grid {\n  position: relative; display: grid; grid-template-columns: 1.08fr .92fr;\n  gap: 40px; align-items: center; width: 100%;\n}\n.laf-hero-copy { padding: 40px 0 80px; }\n.laf-hero-badge {\n  display: inline-flex; align-items: center; gap: 8px;\n  padding: 7px 14px 7px 8px; border-radius: var(--r-pill);\n  background: #fff; border: 1px solid var(--line);\n  font-size: 12.5px; font-weight: 700; color: var(--text);\n  box-shadow: var(--shadow-card);\n  margin-bottom: 28px;\n}\n.laf-hero-badge .tag {\n  padding: 3px 9px; border-radius: var(--r-pill);\n  background: var(--accent); color: #fff;\n  font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;\n}\n.laf-hero-copy .laf-display .ln { display: block; }\n.laf-hero-copy .laf-display .hl { color: var(--accent); }\n.laf-hero-sub { margin-top: 26px; }\n.laf-hero-actions { display: flex; gap: 14px; margin-top: 38px; flex-wrap: wrap; }\n\n.laf-stores { display: flex; gap: 10px; margin-top: 22px; }\n.laf-store {\n  display: inline-flex; align-items: center; gap: 10px;\n  height: 46px; padding: 0 18px; border-radius: 14px;\n  background: #fff; border: 1px solid var(--line);\n  color: var(--ink); transition: border-color var(--t-fast), transform var(--t-medium) var(--ease-default);\n}\n.laf-store:hover { border-color: var(--ink); color: var(--ink); transform: translateY(-2px); }\n.laf-store > span:last-child { display: flex; flex-direction: column; gap: 2px; }\n.laf-store .k { font-size: 10px; font-weight: 600; color: var(--muted); line-height: 1.1; }\n.laf-store .v { font-size: 14px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }\n.laf-store svg { flex-shrink: 0; }\n\n/* hero phone stage */\n.laf-stage {\n  position: relative; height: 100%; min-height: 680px;\n  display: flex; align-items: flex-end; justify-content: center;\n}\n.laf-hero-phone {\n  position: relative;\n  transform-origin: 50% 100%;\n  transform: translateY(0);\n  will-change: transform;\n}\n\n/* floating chips */\n.laf-chip {\n  position: absolute; z-index: 5;\n  display: flex; align-items: center; gap: 9px;\n  background: #fff; border: 1px solid var(--line-2); border-radius: 16px;\n  padding: 12px 16px; box-shadow: var(--shadow-floating);\n  font-size: 13px; font-weight: 700; color: var(--ink);\n  white-space: nowrap;\n}\n.laf-chip .lbl { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-bottom: 2px; }\n.laf-chip .num { font-family: var(--font-mono); font-size: 14px; letter-spacing: -0.01em; }\n.laf-chip .up { color: var(--pos); }\n.laf-chip .ic {\n  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;\n  display: flex; align-items: center; justify-content: center;\n}\n.laf-chip .ic--green { background: var(--pos-soft); }\n.laf-chip .ic--indigo { background: var(--indigo-soft); }\n/* Chips hang off the phone edges — anchored to the phone box itself so they\n   clear the screen content at any scale instead of covering it.\n   ch3 sits high enough to clear the hero's centred scroll hint: the chip is\n   anchored to the phone while the hint is centred on the whole hero, so the two\n   have different horizontal origins and can only be separated vertically. */\n.laf-chip.ch1 { top: 7%; right: calc(100% - 26px); left: auto; }\n.laf-chip.ch2 { top: 45%; left: calc(100% - 26px); right: auto; }\n.laf-chip.ch3 { bottom: 34%; right: calc(100% - 26px); left: auto; }\n\n.laf-scrollhint {\n  position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);\n  display: flex; flex-direction: column; align-items: center; gap: 8px;\n  font-family: var(--font-mono); font-size: 10px; font-weight: 600;\n  letter-spacing: .22em; text-transform: uppercase; color: var(--muted-2);\n}\n.laf-scrollhint i {\n  width: 1.5px; height: 34px; background: linear-gradient(var(--muted-2), transparent);\n  display: block; animation: laf-drip 2s var(--ease-default) infinite;\n}\n@keyframes laf-drip {\n  0% { transform: scaleY(0); transform-origin: top; }\n  45% { transform: scaleY(1); transform-origin: top; }\n  55% { transform: scaleY(1); transform-origin: bottom; }\n  100% { transform: scaleY(0); transform-origin: bottom; }\n}\n\n/* ---------- Ticker ---------- */\n.laf-ticker {\n  border-block: 1px solid var(--line-2);\n  background: #fff; overflow: hidden; padding: 16px 0;\n  position: relative; z-index: 2;\n}\n.laf-ticker-track {\n  display: flex; gap: 56px; width: max-content;\n  animation: laf-marquee 36s linear infinite;\n}\n.laf-ticker:hover .laf-ticker-track { animation-play-state: paused; }\n@keyframes laf-marquee { to { transform: translateX(-50%); } }\n.laf-tick {\n  display: inline-flex; align-items: center; gap: 10px;\n  font-family: var(--font-mono); font-size: 13px; font-weight: 600;\n  color: var(--text); font-variant-numeric: tabular-nums;\n}\n.laf-tick .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); }\n.laf-tick b { color: var(--ink); font-weight: 600; }\n.laf-tick .rate { color: var(--pos); }\n\n/* ---------- Stats ---------- */\n.laf-stats { padding: 110px 0 90px; }\n.laf-stats-grid {\n  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;\n  border-top: 1px solid var(--line-2);\n  padding-top: 48px;\n}\n.laf-stat .v {\n  font-size: clamp(38px, 4vw, 58px); font-weight: 800; letter-spacing: -0.03em;\n  color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1;\n}\n.laf-stat .v .u { font-size: .55em; font-weight: 700; color: var(--muted); margin-left: 2px; }\n.laf-stat .l { font-size: 13.5px; font-weight: 600; color: var(--muted); margin-top: 12px; line-height: 1.45; max-width: 200px; }\n\n/* ---------- Tour (scrollytelling) ---------- */\n.laf-tour { position: relative; background: var(--bg); border-block: 1px solid var(--line-2); }\n.laf-tour-head { padding: 110px 0 20px; max-width: 720px; }\n.laf-tour-head .laf-sub { margin-top: 22px; }\n.laf-tour-grid {\n  display: grid; grid-template-columns: minmax(0,1fr) 480px;\n  gap: 60px; align-items: start;\n  padding-bottom: 12vh;\n}\n.laf-tour-steps { display: flex; flex-direction: column; }\n.laf-step {\n  min-height: 88vh; display: flex; flex-direction: column; justify-content: center;\n  max-width: 480px;\n}\n.laf-step .idx {\n  font-family: var(--font-mono); font-size: 13px; font-weight: 600;\n  color: var(--muted-2); letter-spacing: .14em;\n}\n.laf-step h3 {\n  font-size: clamp(28px, 2.6vw, 40px); font-weight: 800;\n  letter-spacing: -0.025em; line-height: 1.08; margin: 18px 0 0;\n}\n.laf-step p { font-size: 16px; line-height: 1.65; color: var(--muted); margin-top: 18px; max-width: 420px; }\n.laf-step .pts { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }\n.laf-step .pt { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: var(--text); }\n.laf-step .pt .tick {\n  width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0;\n  background: #fff; border: 1px solid var(--line);\n  display: flex; align-items: center; justify-content: center;\n}\n.laf-step { opacity: .28; transition: opacity .45s var(--ease-default); }\n.laf-step.is-active { opacity: 1; }\n\n.laf-tour-phone-col { position: relative; align-self: stretch; }\n.laf-tour-sticky {\n  position: sticky; top: calc(50vh - 336px);\n  height: 671px;\n  display: flex; align-items: center; justify-content: center;\n  padding: 0;\n}\n\n/* screen crossfade inside tour phone */\n.laf-scrset .scr { opacity: 0; transform: translateY(14px); transition: opacity .5s var(--ease-default), transform .5s var(--ease-default); pointer-events: none; }\n.laf-scrset .scr.is-on { opacity: 1; transform: none; }\n\n/* ---------- Invest · products × trajectory ----------\n   The four instruments and the growth curve are one section because they answer\n   one question: which of these, and what does it do to my money? Picking a card\n   redraws the curve; all four are always drawn as a ghosted fan, so the spread\n   between the best and worst choice is visible rather than asserted. The cards\n   are deliberately minimal — the chart carries the weight now, and each card\n   only has to say what it is, what it pays, and where it lands. */\n.laf-invest { padding: 130px 0 110px; }\n/* Grid, not flex: .laf-sub carries a 520px basis and won't shrink below its own\n   min-content, so under flex the heading column absorbed the entire loss and\n   broke to 4 cramped lines between 901px and ~1090px. A max-content track\n   guarantees the authored two-line break and lets the subcopy take the rest. */\n.laf-sec-head { display: grid; grid-template-columns: max-content minmax(0, 520px); justify-content: space-between; align-items: end; gap: 40px; margin-bottom: 44px; }\n.laf-sec-head .laf-sub { margin-top: 22px; }\n\n/* picker */\n.laf-pick-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }\n.laf-pick {\n  position: relative; display: flex; flex-direction: column; align-items: flex-start;\n  text-align: left; cursor: pointer; font-family: inherit;\n  padding: 18px 18px 16px; border-radius: 18px;\n  background: #fff; border: 1.5px solid var(--line-2);\n  transition: border-color .2s, box-shadow .22s var(--ease-default), transform .22s var(--ease-default), background .2s;\n}\n.laf-pick::after {\n  content: ''; position: absolute; left: 18px; right: 18px; top: 0; height: 3px;\n  border-radius: 0 0 3px 3px; background: var(--c1);\n  transform: scaleX(0); transform-origin: center; transition: transform .24s var(--ease-default);\n}\n.laf-pick:hover { border-color: color-mix(in oklab, var(--c1) 38%, var(--line)); transform: translateY(-3px); box-shadow: var(--e-2); }\n.laf-pick.on {\n  border-color: var(--c1); background: color-mix(in oklab, var(--c1) 4%, #fff);\n  box-shadow: 0 14px 34px -20px color-mix(in oklab, var(--c1) 80%, transparent);\n}\n.laf-pick.on::after { transform: scaleX(1); }\n.laf-pick:focus-visible { outline: 2px solid var(--c1); outline-offset: 3px; }\n.laf-pick .glyph {\n  width: 38px; height: 38px; border-radius: 11px;\n  /* raw brand greens/oranges sit at ~2.8:1 on their own tinted fill — below the\n     3:1 minimum for meaningful non-text marks, so darken toward ink */\n  color: color-mix(in oklab, var(--c1) 74%, #0B1020);\n  background: color-mix(in oklab, var(--c1) 9%, #fff);\n  border: 1px solid color-mix(in oklab, var(--c1) 18%, var(--line-2));\n  display: flex; align-items: center; justify-content: center;\n}\n.laf-pick .open {\n  position: absolute; top: 18px; right: 16px;\n  display: inline-flex; align-items: center; gap: 5px;\n  font-size: 10.5px; font-weight: 700; color: var(--muted);\n  font-variant-numeric: tabular-nums; white-space: nowrap;\n}\n.laf-pick .open i {\n  width: 5px; height: 5px; border-radius: 50%; background: var(--pos); flex-shrink: 0;\n  box-shadow: 0 0 0 2.5px color-mix(in oklab, var(--pos) 18%, transparent);\n  animation: laf-live 2.4s var(--ease-default) infinite;\n}\n@keyframes laf-live { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }\n/* two reserved lines so the four cards stay a single row of equals */\n.laf-pick .nm { font-size: 14.5px; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; line-height: 1.3; margin-top: 14px; min-height: 2.6em; }\n/* 17px/800 is normal text for WCAG (bold needs ≥18.66px), so the rate must\n   clear 4.5:1 — the raw --c1 greens and oranges are 2.8–3.4:1 on the card. */\n.laf-pick .rt { font-size: 17px; font-weight: 800; color: color-mix(in oklab, var(--c1) 68%, #0B1020); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; margin-top: 4px; }\n.laf-pick .tm { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 5px; line-height: 1.45; }\n.laf-pick .out {\n  display: flex; flex-direction: column; gap: 2px; width: 100%;\n  margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-2);\n}\n.laf-pick .out b { font-size: 16px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }\n.laf-pick .out i { font-size: 10.5px; font-weight: 600; color: var(--muted); font-style: normal; }\n\n/* plot card — light, so the section reads as one page rather than a black box */\n.laf-plot-card {\n  margin-top: 20px; padding: 40px 40px 32px; border-radius: 28px;\n  background: #fff; border: 1px solid var(--line-2); box-shadow: var(--e-2);\n  --selc: #4F46E5;\n  /* A pale groove with a 3:1 edge, rather than a dark fill: darkening the track\n     itself to reach 3:1 against white dropped the filled/unfilled distinction\n     to ~1.2:1, which is the one thing the track exists to show. */\n  --track: var(--line-2);\n  --track-edge: color-mix(in oklab, var(--muted-2) 82%, #fff);\n  /* The chart keeps each instrument's raw brand colour for identity; the control\n     uses a darkened variant, because the lighter brand oranges/greens sit under\n     3:1 against the pale groove and the fill is a state indicator. */\n  --selc-ui: color-mix(in oklab, var(--selc) 82%, #0B1020);\n}\n\n/* outcome */\n.laf-grow-figure { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; flex-wrap: wrap; }\n.laf-grow-out .k { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }\n.laf-grow-out .k b { font-weight: 800; color: var(--ink); }\n.laf-grow-out .v {\n  font-size: clamp(40px, 5vw, 66px); font-weight: 800; letter-spacing: -0.04em; line-height: 1.02;\n  font-variant-numeric: tabular-nums; margin-top: 6px; color: var(--ink);\n}\n.laf-grow-chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }\n.laf-grow-delta {\n  display: inline-flex; align-items: center; gap: 7px;\n  padding: 8px 14px; border-radius: 999px;\n  background: color-mix(in oklab, var(--pos) 9%, #fff); border: 1px solid color-mix(in oklab, var(--pos) 26%, transparent);\n  font-size: 13px; font-weight: 600; color: color-mix(in oklab, var(--pos) 70%, #06231A);\n}\n.laf-grow-delta b { font-weight: 800; color: color-mix(in oklab, var(--pos) 62%, #06231A); font-variant-numeric: tabular-nums; }\n.laf-grow-delta.earn { background: var(--line-2); border-color: var(--line); color: var(--text); }\n.laf-grow-delta.earn b { color: var(--ink); }\n/* an instrument can pay LESS than a bank deposit — commercial paper does. The\n   chip flips tone and the arrow flips direction rather than dressing it up. */\n.laf-grow-delta.neg { background: color-mix(in oklab, var(--warn) 10%, #fff); border-color: color-mix(in oklab, var(--warn) 30%, transparent); color: #7A5410; }\n.laf-grow-delta.neg b { color: #7A5410; }\n.laf-grow-delta.neg svg { transform: rotate(180deg); }\n\n.laf-grow-legend { display: flex; flex-direction: column; gap: 8px; }\n.laf-grow-legend span { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; font-weight: 600; color: var(--muted); flex-wrap: wrap; }\n.laf-grow-legend b { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }\n.laf-grow-legend i { width: 22px; height: 3px; border-radius: 99px; flex-shrink: 0; }\n.laf-grow-legend i.sel { background: var(--c1, #4F46E5); }\n.laf-grow-legend i.ghost { background: color-mix(in oklab, var(--muted-2) 45%, transparent); }\n.laf-grow-legend i.bank { background: repeating-linear-gradient(90deg, #A8AFC6 0 5px, transparent 5px 10px); }\n/* The rebased non-zero axis is disclosed here rather than over the plot: an\n   absolutely-positioned in-plot label could only ever sit on top of the series,\n   and it covered the origin of all five where they converge at the baseline. */\n.laf-grow-legend i.base { background: repeating-linear-gradient(90deg, var(--muted-2) 0 2px, transparent 2px 6px); }\n\n/* trajectory */\n.laf-grow-chart { display: flex; gap: 14px; margin-top: 26px; }\n.laf-grow-chart .yax {\n  display: flex; flex-direction: column; justify-content: space-between; height: 250px;\n  font-size: 10.5px; font-weight: 600; color: var(--muted);\n  text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums;\n}\n.laf-grow-chart .yax .b { color: var(--ink); font-weight: 800; }\n.laf-grow-chart .plot { flex: 1; min-width: 0; position: relative; }\n.laf-grow-chart svg { display: block; width: 100%; height: 250px; overflow: visible; }\n.laf-grow-chart .xax {\n  display: flex; justify-content: space-between; margin-top: 12px;\n  font-size: 11px; font-weight: 600; color: var(--muted);\n  font-variant-numeric: tabular-nums;\n}\n[data-grow-line] { transition: stroke .25s var(--ease-default); }\n.laf-plot-card.is-drawing [data-grow-line] { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: laf-draw 1.5s var(--ease-default) forwards; }\n.laf-plot-card.is-drawing [data-grow-gap], .laf-plot-card.is-drawing [data-grow-bank], .laf-plot-card.is-drawing [data-grow-dots], .laf-plot-card.is-drawing [data-grow-fan] { animation: laf-fadein .9s var(--ease-default) .5s both; }\n@keyframes laf-draw { to { stroke-dashoffset: 0 } }\n@keyframes laf-fadein { from { opacity: 0 } to { opacity: 1 } }\n.laf-grow-dot { fill: #fff; stroke-width: 2.5; }\n.laf-grow-halo { opacity: .26; animation: laf-halo 2.6s var(--ease-default) infinite; transform-origin: center; }\n@keyframes laf-halo { 0%, 100% { opacity: .3; r: 7 } 50% { opacity: .08; r: 13 } }\n.laf-grow-vline { stroke: var(--line-2); stroke-width: 1; }\n.laf-grow-base { stroke: var(--muted-2); stroke-width: 1.5; stroke-dasharray: 2 4; }\n\n/* controls — authoring your own number is what creates the wanting */\n.laf-grow-controls {\n  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 32px; align-items: end;\n  margin-top: 30px; padding-top: 26px; border-top: 1px solid var(--line-2);\n}\n.laf-grow-controls label {\n  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;\n  font-size: 12.5px; font-weight: 600; color: var(--muted);\n}\n.laf-grow-controls label b { font-size: 19px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }\n.laf-grow-controls input[type=\"range\"] {\n  -webkit-appearance: none; appearance: none; width: 100%; height: 26px;\n  /* margin set on all sides: the UA default of 2px left/right on range inputs\n     overflows the grid column it fills at narrow widths. */\n  margin: 10px 0 0; background: transparent; cursor: pointer;\n}\n.laf-grow-controls input[type=\"range\"]::-webkit-slider-runnable-track {\n  height: 6px; border-radius: 99px;\n  background: linear-gradient(90deg, var(--selc-ui) var(--fill, 9%), var(--track) var(--fill, 9%));\n  box-shadow: inset 0 0 0 1px var(--track-edge);\n}\n.laf-grow-controls input[type=\"range\"]::-moz-range-track { height: 6px; border-radius: 99px; background: var(--track); box-shadow: inset 0 0 0 1px var(--track-edge); }\n.laf-grow-controls input[type=\"range\"]::-moz-range-progress { height: 6px; border-radius: 99px; background: var(--selc-ui); }\n.laf-grow-controls input[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none; appearance: none;\n  width: 22px; height: 22px; margin-top: -8px; border-radius: 50%;\n  background: #fff; border: 4px solid var(--selc-ui); box-shadow: 0 4px 14px -6px rgba(11,16,32,.4);\n  transition: transform .16s var(--ease-default), border-color .25s;\n}\n.laf-grow-controls input[type=\"range\"]::-moz-range-thumb {\n  width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--selc-ui);\n  background: #fff; box-shadow: 0 4px 14px -6px rgba(11,16,32,.4);\n}\n.laf-grow-controls input[type=\"range\"]:hover::-webkit-slider-thumb { transform: scale(1.12); }\n.laf-grow-controls input[type=\"range\"]:focus-visible { outline: 2px solid var(--selc-ui); outline-offset: 6px; border-radius: 99px; }\n.laf-grow-controls .ticks {\n  display: flex; justify-content: space-between; margin-top: 4px;\n  font-size: 10.5px; font-weight: 600; color: var(--muted);\n}\n.laf-grow-controls .terms { display: flex; gap: 8px; }\n.laf-grow-controls .terms button {\n  height: 44px; padding: 0 18px; border-radius: 14px; cursor: pointer;\n  background: #fff; border: 1.5px solid var(--line-2);\n  color: var(--text); font-family: inherit; font-size: 13.5px; font-weight: 700;\n  white-space: nowrap; transition: background .18s, border-color .18s, color .18s;\n}\n.laf-grow-controls .terms button:hover { border-color: var(--line); color: var(--ink); }\n.laf-grow-controls .terms button.on { background: var(--ink); border-color: var(--ink); color: #fff; }\n.laf-grow-note { font-size: 11.5px; line-height: 1.6; color: var(--muted); margin-top: 22px; max-width: 860px; }\n\n/* ---------- Loan ---------- */\n.laf-loan { padding: 40px 0 130px; }\n.laf-loan-panel {\n  position: relative; overflow: hidden;\n  border-radius: 32px; color: #fff;\n  background: linear-gradient(140deg, #050B1F 0%, #0E1631 52%, #2B2A85 135%);\n  padding: clamp(48px, 6vw, 88px);\n}\n.laf-loan-panel::before {\n  content: ''; position: absolute; right: -120px; top: -140px;\n  width: 480px; height: 480px; border-radius: 50%;\n  background: radial-gradient(circle, rgba(45,107,255,.38), transparent 68%);\n}\n.laf-loan-panel::after {\n  content: ''; position: absolute; right: 140px; bottom: -160px;\n  width: 380px; height: 380px; border-radius: 50%;\n  background: radial-gradient(circle, rgba(255,107,44,.30), transparent 68%);\n}\n.laf-loan-inner { position: relative; z-index: 2; display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(40px, 5vw, 90px); }\n.laf-loan .laf-eyebrow { color: #9DB4FF; }\n.laf-loan .laf-eyebrow::before { background: #9DB4FF; }\n.laf-loan h2 { color: #fff; margin-top: 20px; }\n.laf-loan .lead { font-size: 16.5px; line-height: 1.65; color: rgba(255,255,255,.72); margin-top: 22px; max-width: 480px; }\n.laf-loan-cta { display: flex; gap: 14px; margin-top: 40px; flex-wrap: wrap; }\n.laf-loan .fine { font-size: 12px; color: rgba(255,255,255,.62); margin-top: 18px; }\n\n.laf-loan-rate { display: flex; align-items: baseline; gap: 14px; }\n.laf-loan-rate .big {\n  font-size: clamp(80px, 8.5vw, 128px); font-weight: 800;\n  letter-spacing: -0.045em; line-height: 1;\n  font-variant-numeric: tabular-nums;\n  background: linear-gradient(115deg, #fff 30%, #9DB4FF);\n  -webkit-background-clip: text; background-clip: text; color: transparent;\n}\n.laf-loan-rate .unit { font-size: 15px; font-weight: 700; color: rgba(255,255,255,.65); line-height: 1.4; }\n\n.laf-loan-terms {\n  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 34px;\n}\n.laf-term {\n  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);\n  border-radius: 16px; padding: 16px 18px;\n  backdrop-filter: blur(8px);\n}\n.laf-term .k { font-size: 11px; font-weight: 600; color: rgba(255,255,255,.55); }\n.laf-term .v { font-size: 18px; font-weight: 800; letter-spacing: -0.015em; margin-top: 5px; font-variant-numeric: tabular-nums; }\n\n.laf-loan-steps { display: flex; flex-direction: column; gap: 0; margin-top: 8px; }\n.laf-lstep {\n  display: grid; grid-template-columns: 52px 1fr; gap: 20px;\n  padding: 24px 0; border-bottom: 1px solid rgba(255,255,255,.1);\n}\n.laf-lstep:last-child { border-bottom: none; }\n.laf-lstep .n {\n  width: 52px; height: 52px; border-radius: 16px;\n  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: #9DB4FF;\n}\n.laf-lstep h4 { font-size: 17px; font-weight: 800; letter-spacing: -0.01em; color: #fff; }\n.laf-lstep p { font-size: 13.5px; line-height: 1.6; color: rgba(255,255,255,.62); margin-top: 6px; }\n.laf-lstep .meta-pill {\n  display: inline-flex; align-items: center; gap: 7px; margin-top: 10px;\n  padding: 5px 12px; border-radius: var(--r-pill);\n  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);\n  font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: rgba(255,255,255,.7);\n}\n.laf-lstep .meta-pill .d { width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }\n\n/* ---------- Partners ---------- */\n.laf-partners { padding: 0 0 120px; }\n.laf-partners .cap {\n  text-align: center; font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;\n  letter-spacing: .2em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 40px;\n}\n.laf-logos { overflow: hidden; position: relative; }\n.laf-logos::before, .laf-logos::after {\n  content: ''; position: absolute; top: 0; bottom: 0; width: 120px; z-index: 2; pointer-events: none;\n}\n.laf-logos::before { left: 0; background: linear-gradient(90deg, #FDFDFF, transparent); }\n.laf-logos::after { right: 0; background: linear-gradient(270deg, #FDFDFF, transparent); }\n.laf-logos-track {\n  display: flex; align-items: center; gap: 72px; width: max-content;\n  animation: laf-marquee 40s linear infinite;\n}\n.laf-logos-track img { height: 30px; opacity: .55; filter: grayscale(1); transition: opacity .25s, filter .25s; }\n.laf-logos-track img:hover { opacity: 1; filter: none; }\n\n/* ---------- FAQ ---------- */\n.laf-faq { padding: 0 0 130px; }\n.laf-faq-grid { display: grid; grid-template-columns: .8fr 1.2fr; gap: 70px; align-items: start; }\n.laf-faq-list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }\n.laf-q { border-bottom: 1px solid var(--line); }\n.laf-q button {\n  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px;\n  padding: 24px 4px; background: none; border: none; cursor: pointer;\n  font-family: inherit; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;\n  color: var(--ink); text-align: left;\n}\n.laf-q .pm {\n  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;\n  border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center;\n  transition: background .25s, border-color .25s, transform .35s var(--ease-default);\n}\n.laf-q .pm svg { display: block; }\n.laf-q .pm .v { transition: opacity .2s; }\n.laf-q.is-open .pm { background: var(--ink); border-color: var(--ink); transform: rotate(180deg); }\n.laf-q.is-open .pm .v { opacity: 0; }\n.laf-q.is-open .pm path { stroke: #fff; }\n.laf-q .a {\n  display: grid; grid-template-rows: 0fr; transition: grid-template-rows .4s var(--ease-default);\n}\n.laf-q.is-open .a { grid-template-rows: 1fr; }\n.laf-q .a > div { overflow: hidden; }\n.laf-q .a p { font-size: 15px; line-height: 1.7; color: var(--muted); padding: 0 56px 26px 4px; max-width: 620px; }\n\n/* ---------- Final CTA ---------- */\n.laf-cta { padding: 0 0 40px; }\n.laf-cta-panel {\n  position: relative; overflow: hidden; text-align: center;\n  background: var(--bg); border: 1px solid var(--line-2); border-radius: 32px;\n  padding: clamp(70px, 8vw, 120px) 40px;\n}\n.laf-cta-panel::before {\n  content: ''; position: absolute; inset: 0;\n  background:\n    radial-gradient(420px 320px at 18% 0%, rgba(79,70,229,.08), transparent 70%),\n    radial-gradient(420px 320px at 85% 100%, rgba(255,107,44,.07), transparent 70%);\n}\n.laf-cta-panel > * { position: relative; }\n.laf-cta-panel .mark { height: 52px; margin: 0 auto 32px; display: block; width: auto; }\n.laf-cta-panel .motto {\n  font-family: var(--font-mono); font-size: 12px; font-weight: 600;\n  letter-spacing: .26em; text-transform: uppercase; color: var(--muted-2);\n  margin-top: 26px;\n}\n/* The store links are 46px in the hero where they sit only next to each other;\n   here they share a row with a 56px pill button, so match its height and shape. */\n.laf-cta-actions { display: flex; gap: 14px; justify-content: center; align-items: center; margin-top: 42px; flex-wrap: wrap; }\n.laf-cta-actions .laf-store { height: 56px; padding: 0 24px; border-radius: var(--r-pill); }\n.laf-cta-actions .laf-btn { height: 56px; }\n\n/* ---------- Footer ---------- */\n.laf-footer { border-top: 1px solid var(--line-2); padding: 64px 0 48px; background: #fff; }\n.laf-footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 40px; }\n.laf-footer .flogo img { height: 26px; }\n.laf-footer .fdesc { font-size: 13px; line-height: 1.65; color: var(--muted); margin-top: 18px; max-width: 300px; }\n.laf-footer h5 {\n  font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;\n  color: var(--muted-2); margin: 0 0 18px;\n}\n.laf-footer ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }\n.laf-footer ul a { font-size: 14px; font-weight: 600; color: var(--text); }\n.laf-footer ul a:hover { color: var(--accent); }\n.laf-fcontact li { display: grid; grid-template-columns: 15px 1fr; gap: 11px; align-items: start; font-size: 13.5px; font-weight: 500; line-height: 1.55; color: var(--muted); }\n.laf-fcontact svg { color: var(--muted-2); margin-top: 3px; }\n.laf-footer-base {\n  display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;\n  border-top: 1px solid var(--line-2); margin-top: 56px; padding-top: 28px;\n  font-size: 12.5px; color: var(--muted); font-weight: 500;\n}\n.laf-footer-base .reg { display: flex; align-items: center; gap: 8px; }\n.laf-footer-base .reg .d { width: 6px; height: 6px; border-radius: 50%; background: var(--pos); }\n\n/* ---------- Reveal motion ---------- */\n[data-reveal] { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease-default), transform .8s var(--ease-default); transition-delay: var(--rd, 0s); }\n[data-reveal].is-in { opacity: 1; transform: none; }\n/* Fail-safe (set by the script if reveals never land): show everything with no\n   transition, so content is never stuck invisible. */\nhtml.laf-reveal-off [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }\nhtml[data-motion=\"off\"] [data-reveal] { opacity: 1; transform: none; transition: none; }\nhtml[data-motion=\"off\"] .laf-ticker-track,\nhtml[data-motion=\"off\"] .laf-logos-track,\nhtml[data-motion=\"off\"] .laf-scrollhint i { animation: none; }\n\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n  [data-reveal] { opacity: 1; transform: none; transition: none; }\n  .laf-ticker-track, .laf-logos-track, .laf-scrollhint i { animation: none; }\n  .laf-prod .fill { transform: scaleX(1); transition: none; }\n  .laf-prod .open i { animation: none; }\n  .laf-scrset .scr, .laf-step, .laf-pick, .laf-btn { transition: none; }\n}\n\n/* ---------- Responsive ---------- */\n@media (max-width: 1100px) {\n  .laf-pick-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  /* Below this width the stage is too narrow for the right-hand chip to fit. */\n  .laf-chip.ch2 { display: none; }\n  .laf-tour-grid { grid-template-columns: minmax(0,1fr) 400px; gap: 32px; }\n  .laf-loan-inner { grid-template-columns: 1fr; }\n  .laf-hero-grid { grid-template-columns: 1fr .8fr; }\n}\n@media (max-width: 1020px) {\n  .laf-nav-links { display: none; }\n}\n@media (max-width: 900px) {\n  /* The plot card's controls grid goes single-column here: the term-chip row's\n     min-content width would otherwise starve the slider column to 0px.\n     Making .terms a grid removes that floor so it can shrink with the card. */\n  .laf-grow-controls { grid-template-columns: minmax(0, 1fr); gap: 24px; }\n  /* minmax(0,…) not 1fr: a bare 1fr is minmax(auto,1fr), so the buttons'\n     min-content width would floor the track and push the card wider. */\n  .laf-grow-controls .terms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }\n  .laf-grow-controls .terms button { padding: 0 10px; min-width: 0; }\n  .laf-grow-figure { gap: 22px; }\n  .laf-plot-card { padding: 32px 26px 26px; }\n  .laf-hero { min-height: 0; }\n  .laf-hero-grid { grid-template-columns: 1fr; }\n  .laf-stage { min-height: 0; margin-top: 20px; justify-content: center; }\n  .laf-chip.ch3 { right: calc(100% - 40px); }\n  .laf-scrollhint { display: none; }\n  .laf-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 40px 24px; }\n  .laf-tour-grid { grid-template-columns: 1fr; }\n  .laf-tour-phone-col { display: none; }\n  .laf-step { min-height: 0; padding: 44px 0; opacity: 1; }\n  .laf-faq-grid { grid-template-columns: 1fr; gap: 40px; }\n  .laf-footer-grid { grid-template-columns: 1fr 1fr; }\n  .laf-sec-head { grid-template-columns: minmax(0, 1fr); justify-items: start; }\n}\n@media (max-width: 620px) {\n  .laf-wrap { padding: 0 22px; }\n  .laf-plot-card { padding: 24px 18px 22px; border-radius: 22px; }\n  /* the clamp floor (40px) is wider than a 250px column at 12 digits */\n  .laf-grow-out .v { font-size: clamp(26px, 8.2vw, 40px); }\n  .laf-grow-out .k { font-size: 12px; }\n  .laf-grow-chart { gap: 9px; }\n  .laf-grow-chart .xax { font-size: 9.5px; }\n  .laf-grow-chart .yax { font-size: 9.5px; }\n  .laf-grow-controls .terms button { font-size: 12.5px; height: 42px; }\n  .laf-pick { padding: 14px 14px 13px; }\n  .laf-pick .nm { font-size: 13.5px; min-height: 0; }\n  .laf-pick .open { position: static; margin-top: 10px; }\n  .laf-pick .glyph { width: 34px; height: 34px; }\n  .laf-hero-actions .laf-btn { width: 100%; }\n  .laf-chip { display: none; }\n  .laf-loan-terms { grid-template-columns: 1fr 1fr; }\n  .laf-footer-grid { grid-template-columns: 1fr; }\n}\n\n/* ---------- ISO / trust strip (hero) ---------- */\n.laf-iso{display:flex;align-items:center;flex-wrap:wrap;gap:8px 18px;margin-top:30px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n.laf-iso .i{display:inline-flex;align-items:center;gap:7px}\n.laf-iso .i svg{opacity:.65}\n.laf-iso .sep{width:1px;height:11px;background:var(--line);display:inline-bl ackground:var(--rcs);border-bottom:1px solid color-mix(in oklab, var(--rc) 14%, var(--line-2))}\n.laf-rcard-top .ic{flex-shrink:0;width:42px;height:42px;border-radius:13px;background:#fff;border:1px solid color-mix(in oklab, var(--rc) 18%, var(--line-2));display:flex;align-items:center;justify-content:center;color:var(--rc)}\n.laf-rcard h3{font-size:18px;font-weight:800;letter-spacing:-.015em;color:var(--ink);line-height:1.3}\n.laf-rcard .cnt{display:block;margin-top:4px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}\n.laf-rlist{display:flex;flex-direction:column;margin:0;padding:6px 30px 22px;counter-reset:rq}\n.laf-rlist li{list-style:none;counter-increment:rq;display:grid;grid-template-columns:26px 1fr;gap:14px;padding:15px 0;border-top:1px solid var(--line-2);font-size:14px;line-height:1.62;color:var(--text)}\n.laf-rlist li:first-child{border-top:none}\n.laf-rlist li::before{content:counter(rq,decimal-leading-zero);font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--rc);opacity:.75;padding-top:3px;letter-spacing:.04em}\n\n/* document accordions */\n.laf-repo-docs{margin-top:26px;background:#fff;border:1px solid var(--line);border-radius:26px;padding:0 30px}\n.laf-repo-docs .laf-q button{font-size:17px}\n.laf-repo-docs .laf-q .a ol{margin:0;padding:0 0 30px;counter-reset:d;columns:2;column-gap:40px;max-width:none}\n.laf-repo-docs .laf-q .a li{list-style:none;counter-increment:d;display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:14px;line-height:1.6;color:var(--muted);break-inside:avoid;padding:9px 0}\n.laf-repo-docs .laf-q .a li::before{content:counter(d,decimal-leading-zero);font-family:var(--font-mono);font-size:11.5px;font-weight:600;color:var(--accent);padding-top:3px}\n\n@media (max-width:1000px){\n  .laf-repo-flow{grid-template-columns:1fr}\n  .laf-rf-sep{border-inline:none;border-top:1px solid var(--line-2);padding:14px 0}\n  .laf-rf-sep svg{transform:rotate(90deg)}\n  .laf-repo-docs .laf-q .a ol{columns:1}\n}\n\n/* ---------- About (landing band) ---------- */\n.laf-about{padding:0 0 130px}\n.laf-about-inner{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:start;border-top:1px solid var(--line);padding-top:64px}\n.laf-about p{font-size:16.5px;line-height:1.72;color:var(--muted);max-width:600px}\n.laf-about p + p{margin-top:18px}\n.laf-about .laf-btn{margin-top:32px}\n.laf-about-facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}\n.laf-about-facts span{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border:1px solid var(--line);border-radius:var(--r-pill);font-family:var(--font-mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--text)}\n\n/* ---------- Sub pages ---------- */\n.laf-page{padding:calc(var(--nav-h) + 84px) 0 40px}\n.laf-page-head{max-width:760px}\n.laf-page-head .laf-h2{margin-top:20px}\n.laf-page-head .laf-sub{margin-top:24px;max-width:640px}\n.laf-prose{max-width:760px;margin-top:64px;display:flex;flex-direction:column;gap:34px}\n.laf-prose h3{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink);margin-bottom:14px}\n.laf-prose p{font-size:16.5px;line-height:1.72;color:var(--muted)}\n.laf-prose p + p{margin-top:14px}\n.laf-prose ul{margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}\n.laf-prose li{list-style:none;display:grid;grid-template-columns:18px 1fr;gap:12px;font-size:15.5px;line-height:1.65;color:var(--text)}\n.laf-prose li::before{content:'';width:7px;height:7px;border-radius:2px;background:var(--accent);opacity:.35;margin-top:7px}\n.laf-embed{margin-top:48px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 24px 60px -40px rgba(11,16,32,.35)}\n.laf-embed-bar{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 22px;border-bottom:1px solid var(--line-2);font-family:var(--font-mono);font-size:11.5px;font-weight:600;le
