<!-- @dsCard group="Spacing" viewport="700x210" name="Shadows & elevation" subtitle="Cards use a 1px line, not shadow — shadows are reserved" -->
<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--bg);padding:28px;}
  .row{display:flex;gap:24px;flex-wrap:wrap;}
  .item{text-align:center;}
  .sq{width:110px;height:70px;background:var(--surface);border-radius:16px;}
  .line{border:1px solid var(--line);}
  .tok{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);margin-top:12px;}
</style></head>
<body>
<div class="row">
  <div class="item"><div class="sq line"></div><div class="tok">1px line</div></div>
  <div class="item"><div class="sq" style="box-shadow:var(--e-1)"></div><div class="tok">e-1</div></div>
  <div class="item"><div class="sq" style="box-shadow:var(--e-2)"></div><div class="tok">e-2</div></div>
  <div class="item"><div class="sq" style="box-shadow:var(--e-3)"></div><div class="tok">e-3</div></div>
  <div class="item"><div class="sq" style="box-shadow:var(--shadow-cta);background:var(--indigo)"></div><div class="tok">shadow-cta</div></div>
</div>
</body></html>
