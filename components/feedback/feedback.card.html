<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="stylesheet" href="../../styles.css"/>
<script src="../../foundations.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../../comp_atoms.jsx"></script>
<script type="text/babel" src="../../comp_kit.jsx"></script>
<style>
  body { margin:0; background:var(--surface); padding:22px; }
  .lbl { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .box { border:1px solid var(--line-2); border-radius:14px; overflow:hidden; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { WebEmptyState, WebErrorState, WebSkeletonBlock, WebDisclaimer } = window;
function Card(){
  return (
    <div>
      <div className="cols">
        <div>
          <div className="lbl">Empty state</div>
          <div className="box"><WebEmptyState title="Таны багц хоосон байна" body="Эхний бүтээгдэхүүнээ аваад эхэлнэ үү." action={{label:'Бүтээгдэхүүн үзэх'}}/></div>
        </div>
        <div>
          <div className="lbl">Error / warn / info</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            <WebErrorState variant="neg" title="Алдаа гарлаа" body="Сүлжээ тасарлаа." action={{label:'Дахин ачаалах'}}/>
            <WebErrorState variant="warn" title="Хүлээгдэж байна" body="Гүйлгээ баталгаажуулж байна."/>
          </div>
        </div>
      </div>
      <div style={{marginTop:20}}>
        <div className="lbl">Skeleton (loading)</div>
        <div className="box" style={{padding:16,display:'flex',gap:14,alignItems:'center'}}>
          <WebSkeletonBlock variant="avatar"/>
          <div style={{flex:1,display:'flex',flexDirection:'column',gap:8}}>
            <WebSkeletonBlock variant="title" width="60%"/>
            <WebSkeletonBlock variant="text" width="85%"/>
          </div>
          <WebSkeletonBlock variant="num" width={90}/>
        </div>
      </div>
      <div style={{marginTop:20}}>
        <div className="lbl">Disclaimer (СЗХ)</div>
        <WebDisclaimer>Өгөөж нь зах зээлийн нөхцөл болон бүтээгдэхүүний нөхцөлөөс хамааран өөрчлөгдөж болно.</WebDisclaimer>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
