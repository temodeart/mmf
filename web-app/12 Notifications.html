<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Мэдэгдэл — Money Market Fund</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="../foundations.js"></script>
<script src="../portal-scope.js"></script>
<script src="../mmf_notifications.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../comp_atoms.jsx"></script>
<script type="text/babel" src="../comp_kit.jsx"></script>
<style>
  body {
    background:
      radial-gradient(1200px 600px at 18% -5%, #EEF0FE 0%, transparent 58%),
      radial-gradient(1000px 520px at 100% 105%, #FFEDE2 0%, transparent 60%),
      var(--bg);
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #DADEEA; border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
  .notif-row:hover { background: #F6F7FB; }
  /* preview-only state switcher — not part of the shipped screen */
  .scn-switch { position: fixed; top: 18px; right: 22px; z-index: 90; display: flex; align-items: center; gap: 10px; background: rgba(11,16,32,.92); backdrop-filter: blur(6px); border-radius: 14px; padding: 8px 10px 8px 14px; box-shadow: 0 10px 30px -10px rgba(0,0,0,.45); }
  .scn-switch__label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #A8AFC9; }
  .scn-btn { border: none; background: transparent; color: #C4C9DE; font-size: 12.5px; font-weight: 700; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-family: inherit; }
  .scn-btn.active { background: #4F46E5; color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo } = React;
const { T, WebButton, WebFilterChips, WebSidebar, WebTopbar, WebFooter, WebPageHeader } = window;

const CHIPS = [
  { value:'all',   label:'Бүгд' },
  { value:'txn',   label:'Гүйлгээ',  color: window.MMF_NOTIF_CAT.txn.color },
  { value:'loan',  label:'Зээл',     color: window.MMF_NOTIF_CAT.loan.color },
  { value:'trade', label:'Арилжаа',  color: window.MMF_NOTIF_CAT.trade.color },
  { value:'sys',   label:'Систем',   color: window.MMF_NOTIF_CAT.sys.color },
];

const _catIcon = (cat, color) => {
  const p = { stroke:color, strokeWidth:2, fill:'none', strokeLinecap:'round', strokeLinejoin:'round' };
  if (cat==='txn')   return <g {...p}><path d="M8 7V4l-4 4 4 4V9h8M16 17v3l4-4-4-4v3H8"/></g>;
  if (cat==='loan')  return <g {...p}><circle cx="8" cy="8" r="2.2"/><circle cx="16" cy="16" r="2.2"/><path d="M7 17L17 7"/></g>;
  if (cat==='trade') return <g {...p}><path d="M4 19V5M4 19h16M8 14l3-4 3 2 4-6"/></g>;
  return <g {...p}><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.5 6.5l1.4 1.4M16.1 16.1l1.4 1.4M17.5 6.5l-1.4 1.4M7.9 16.1l-1.4 1.4"/></g>;
};
const _critIcon = color => <g stroke={color} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 10v4M12 17.4h.01"/></g>;

/* day-group label: Өнөөдөр / Өчигдөр / calendar date */
const dayLabel = (ts) => {
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diff = Math.round((startOfDay(new Date()) - startOfDay(new Date(ts))) / 86400000);
  if (diff === 0) return 'Өнөөдөр';
  if (diff === 1) return 'Өчигдөр';
  return window.formatDate(ts);
};

const NotifRow = ({ n, onOpen }) => {
  const cat = window.MMF_NOTIF_CAT[n.cat] || window.MMF_NOTIF_CAT.sys;
  return (
    <button onClick={() => onOpen(n)} className="notif-row" style={{
      width:'100%', textAlign:'left', display:'flex', gap:14, padding:16, cursor:'pointer', fontFamily:'inherit',
      background: n.critical ? T.negSoft : T.surface,
      border:`1px solid ${n.critical ? T.negBorder : T.line2}`, borderRadius:16,
      opacity: n.unread ? 1 : .68, transition:'opacity .15s, background .15s',
    }}>
      <div style={{ width:44, height:44, borderRadius:12, background: n.critical ? '#fff' : `${cat.color}18`, display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none">{n.critical ? _critIcon(T.neg) : _catIcon(n.cat, cat.color)}</svg>
      </div>
      <div style={{ flex:1, minWidth:0 }}>
        <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:12 }}>
          <div style={{ fontSize:14, fontWeight:700, color: n.critical ? T.neg : T.ink, lineHeight:1.35 }}>{n.title}</div>
          <div style={{ display:'flex', alignItems:'center', gap:7, flexShrink:0, paddingTop:2 }}>
            <span className="num" style={{ fontSize:11, color:T.muted2, fontWeight:600 }}>{window.formatRelative(n.date)}</span>
            {n.unread && <span style={{ width:8, height:8, borderRadius:99, background:'#FF6B2C' }}/>}
          </div>
        </div>
        <div style={{ fontSize:12.5, color:T.muted, marginTop:5, lineHeight:1.5 }}>{n.body}</div>
        <div style={{ marginTop:8, display:'inline-flex', alignItems:'center', gap:5, fontSize:11.5, fontWeight:700, color:T.indigo }}>
          {cat.label} руу очих
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={T.indigo} strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </div>
      </div>
    </button>
  );
};

const NotifEmpty = () => (
  <div style={{ background:T.surface, border:`1px dashed ${T.line}`, borderRadius:20, padding:'56px 24px', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center' }}>
    <div style={{ width:72, height:72, borderRadius:20, background:T.indigoSoft, display:'flex', alignItems:'center', justifyContent:'center' }}>
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M6 9a6 6 0 1112 0c0 6 2.5 7 2.5 7H3.5S6 15 6 9z" stroke={T.indigo} strokeWidth="1.8" strokeLinejoin="round"/><path d="M10 20a2 2 0 004 0" stroke={T.indigo} strokeWidth="1.8" strokeLinecap="round"/></svg>
    </div>
    <div style={{ fontSize:16, fontWeight:800, color:T.ink, marginTop:18 }}>Мэдэгдэл байхгүй байна</div>
    <div style={{ fontSize:13, color:T.muted, marginTop:6, lineHeight:1.5, maxWidth:280 }}>Шинэ гүйлгээ, арилжаа болон системийн мэдэгдэл энд харагдана.</div>
  </div>
);

const NotifFilterEmpty = () => (
  <div style={{ background:T.surface, border:`1px solid ${T.line2}`, borderRadius:20, padding:'48px 24px', display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center' }}>
    <div style={{ width:60, height:60, borderRadius:16, background:'#F4F5F9', display:'flex', alignItems:'center', justifyContent:'center' }}>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke={T.muted2} strokeWidth="2"/><path d="M16 16l4 4" stroke={T.muted2} strokeWidth="2" strokeLinecap="round"/></svg>
    </div>
    <div style={{ fontSize:14.5, fontWeight:800, color:T.ink, marginTop:14 }}>Энэ төрлийн мэдэгдэл алга</div>
    <div style={{ fontSize:12.5, color:T.muted, marginTop:6 }}>Өөр төрөл сонгож үзнэ үү.</div>
  </div>
);

const NotificationsPage = () => {
  const [scenario, setScenario] = useState('default'); // default | empty | allread
  const [filter, setFilter] = useState('all');
  const [, tick] = useState(0);

  let all = window.MMFNotifs.list();
  if (scenario === 'empty')   all = [];
  if (scenario === 'allread') all = all.map(n => ({ ...n, unread:false }));

  const filtered = filter === 'all' ? all : all.filter(n => n.cat === filter);
  const unreadCount = all.filter(n => n.unread).length;

  const groups = useMemo(() => {
    const g = [];
    filtered.forEach(n => {
      const label = dayLabel(n.date);
      let bucket = g.find(x => x.label === label);
      if (!bucket) { bucket = { label, items:[] }; g.push(bucket); }
      bucket.items.push(n);
    });
    return g;
  }, [filtered.map(n=>n.id).join(','), filtered.map(n=>n.unread).join(',')]);

  const open = (n) => {
    if (scenario !== 'empty') window.MMFNotifs.markRead(n.id);
    window.location.href = n.url;
  };
  const markAll = () => { window.MMFNotifs.markAllRead(); tick(x => x+1); };

  return (
    <div style={{ display:'flex', minHeight:'100vh' }}>
      <div className="scn-switch">
        <span className="scn-switch__label">Төлөв</span>
        <button className={'scn-btn'+(scenario==='default'?' active':'')} onClick={()=>setScenario('default')}>Ердийн</button>
        <button className={'scn-btn'+(scenario==='allread'?' active':'')} onClick={()=>setScenario('allread')}>Бүгд уншсан</button>
        <button className={'scn-btn'+(scenario==='empty'?' active':'')} onClick={()=>setScenario('empty')}>Хоосон</button>
      </div>

      <a href="#mmf-main" className="skip-link">Үндсэн хэсэг рүү очих</a>
      <WebSidebar activePath="/notifications"/>
      <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
        <WebTopbar title="Мэдэгдэл" notifCount={unreadCount}/>
        <main id="mmf-main" tabIndex={-1} style={{ flex:1, padding:'30px 36px 40px', outline:'none' }}>
          <div style={{ maxWidth:820, margin:'0 auto' }}>

            <WebPageHeader title="Мэдэгдэл" subtitle="Гүйлгээ, арилжаа, зээл болон системийн мэдэгдлүүд"
              right={scenario!=='empty' && unreadCount>0 ? <WebButton variant="ghost" size="sm" onClick={markAll}>Бүгдийг унших</WebButton> : null}/>

            {scenario !== 'empty' && (
              <div style={{ marginBottom:20 }}>
                <WebFilterChips options={CHIPS} value={filter} onChange={setFilter}/>
              </div>
            )}

            {scenario === 'empty' ? (
              <NotifEmpty/>
            ) : filtered.length === 0 ? (
              <NotifFilterEmpty/>
            ) : (
              <div style={{ display:'flex', flexDirection:'column', gap:26 }}>
                {groups.map(g => (
                  <div key={g.label}>
                    <div style={{ fontSize:12, fontWeight:700, color:T.muted, letterSpacing:'.04em', textTransform:'uppercase', marginBottom:10 }}>{g.label}</div>
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                      {g.items.map(n => <NotifRow key={n.id} n={n} onOpen={open}/>)}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </main>
        <WebFooter/>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<NotificationsPage/>);
</script>
<script src="../portal-return.js"></script>
</body>
</html>
