<!-- @dsCard group="Type" viewport="700x210" name="Mono & numerics" subtitle="JetBrains Mono · tabular figures · tickers" -->
<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--surface);padding:24px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .box{border:1px solid var(--line-2);border-radius:14px;padding:16px;}
  .lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .amt{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.02em;}
  .tk{font-family:var(--font-mono);font-size:13px;color:var(--text);letter-spacing:.02em;line-height:2;}
  .pos{color:var(--pos);} .neg{color:var(--neg);}
</style></head>
<body>
<div class="grid">
  <div class="box">
    <div class="lbl">Currency · ₮ + tabular</div>
    <div class="amt">₮&nbsp;48,250,000</div>
    <div class="amt pos" style="font-size:18px;margin-top:8px">+₮&nbsp;126,400</div>
    <div class="amt neg" style="font-size:18px">−₮&nbsp;48,000</div>
  </div>
  <div class="box">
    <div class="lbl">Tickers · rates · dates</div>
    <div class="tk">CAPIT 1450 CD 240227</div>
    <div class="tk">MSTRT 2400 IT 171126</div>
    <div class="tk">19.5&#8239;%&#8239;/жил · 272 хоног</div>
    <div class="tk">2027.02.27 · № 200001281</div>
  </div>
</div>
</body></html>
