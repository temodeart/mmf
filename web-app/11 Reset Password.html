<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Нууц үг сэргээх — Money Market Fund</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="../foundations.js"></script>
<script src="../portal-scope.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../comp_atoms.jsx"></script>
<script type="text/babel" src="../comp_kit.jsx"></script>
<style>
  body {
    margin: 0;
    background:
      radial-gradient(1100px 520px at 15% -8%, #EEF0FE 0%, transparent 56%),
      radial-gradient(900px 460px at 100% 110%, #FFEDE2 0%, transparent 58%),
      var(--bg);
    min-height: 100vh;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { T, WebButton, WebOTPInput, WebErrorState } = window;

const RESEND_SECS = 30;
const MAX_ATTEMPTS = 3;

/* ── generic identifier field (и-мэйл эсвэл утас) ── */
const IdentifierInput = ({ value, onChange, error, disabled, onEnter }) => {
  const [focused, setFocused] = useState(false);
  return (
    <div>
      <div style={{ fontSize:12.5, fontWeight:700, color:T.text, marginBottom:8 }}>И-мэйл эсвэл утасны дугаар</div>
      <div style={{
        height:52, borderRadius:14, display:'flex', alignItems:'center', padding:'0 16px', gap:10,
        background: focused ? T.surface : T.field,
        border: `1.5px solid ${error ? T.neg : focused ? T.indigo : T.line}`,
        boxShadow: focused && !error ? `0 0 0 4px ${T.indigoSoft}` : 'none',
        transition:'border-color .15s, box-shadow .15s', opacity: disabled ? .5 : 1,
      }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0 }}><path d="M4 6h16v12H4z" stroke={T.muted2} strokeWidth="1.8" strokeLinejoin="round"/><path d="M4 7l8 6 8-6" stroke={T.muted2} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
        <input value={value} onChange={onChange} disabled={disabled}
          onKeyDown={e => e.key==='Enter' && onEnter?.()}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
          placeholder="tserendorj@example.mn эсвэл 9900 0000"
          style={{ flex:1, border:'none', background:'transparent', outline:'none', fontSize:15, fontWeight:500, color:T.ink, fontFamily:'inherit' }}/>
      </div>
      {error && <div style={{ fontSize:12, color:T.neg, fontWeight:600, marginTop:6 }}>{error}</div>}
    </div>
  );
};

/* ── password field w/ show/hide ── */
const PwInput = ({ label, value, onChange, error, placeholder }) => {
  const [show, setShow] = useState(false);
  const [focused, setFocused] = useState(false);
  return (
    <div>
      <div style={{ fontSize:12.5, fontWeight:700, color:T.text, marginBottom:8 }}>{label}</div>
      <div style={{
        height:52, borderRadius:14, display:'flex', alignItems:'center', padding:'0 14px 0 16px', gap:8,
        background: focused ? T.surface : T.field,
        border: `1.5px solid ${error ? T.neg : focused ? T.indigo : T.line}`,
        boxShadow: focused && !error ? `0 0 0 4px ${T.indigoSoft}` : 'none',
        transition:'border-color .15s, box-shadow .15s',
      }}>
        <input type={show?'text':'password'} value={value} onChange={onChange} placeholder={placeholder}
          onFocus={() => setFocused(true)} onBlur={() => setFocused(false)}
          style={{ flex:1, border:'none', background:'transparent', outline:'none', fontSize:15, fontWeight:500, color:T.ink, fontFamily:'inherit' }}/>
        <button onClick={() => setShow(s=>!s)} type="button" style={{ border:'none', background:'none', cursor:'pointer', color:T.muted, padding:4, display:'flex', alignItems:'center', flexShrink:0 }}>
          {show
            ? <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z" stroke="currentColor" strokeWidth="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="1.8"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
            : <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12s3.6-7 9-7 9 7 9 7-3.6 7-9 7-9-7-9-7z" stroke="currentColor" strokeWidth="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" strokeWidth="1.8"/></svg>}
        </button>
      </div>
      {error && <div style={{ fontSize:12, color:T.neg, fontWeight:600, marginTop:6 }}>{error}</div>}
    </div>
  );
};

/* ── step intro block ── */
const Intro = ({ glyph, title, sub }) => (
  <div style={{ marginBottom:28 }}>
    <div style={{ width:56, height:56, borderRadius:16, background:T.indigoSoft, display:'flex', alignItems:'center', justifyContent:'center', marginBottom:18 }}>{glyph}</div>
    <div style={{ fontSize:28, fontWeight:800, color:T.ink, letterSpacing:'-0.03em', lineHeight:1.12 }}>{title}</div>
    <div style={{ fontSize:14, color:T.muted, fontWeight:500, marginTop:10, lineHeight:1.6 }}>{sub}</div>
  </div>
);

const LockGlyph  = <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="10.5" width="15" height="10" rx="3" stroke={T.indigo} strokeWidth="2"/><path d="M8 10.5V8a4 4 0 018 0v2.5" stroke={T.indigo} strokeWidth="2" strokeLinecap="round"/><circle cx="12" cy="15.5" r="1.6" fill={T.indigo}/></svg>;
const ShieldGlyph= <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6l7-3z" stroke={T.indigo} strokeWidth="2" strokeLinejoin="round"/><path d="M9 12l2 2 4-4" stroke={T.indigo} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const KeyGlyph   = <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="8" cy="9" r="4.5" stroke={T.indigo} strokeWidth="2"/><path d="M11 12l8 8M16 17l2-2M18 19l2-2" stroke={T.indigo} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>;

/* ── mask an identifier for display (no full echo on the code screen) ── */
const looksLikePhone = v => /^[+\d][\d\s]{6,}$/.test(v.trim());
const maskIdentifier = v => {
  const s = v.trim();
  if (looksLikePhone(s)) { const d = s.replace(/\D/g,''); return '+976 •••• ' + d.slice(-4); }
  const [u, dom] = s.split('@');
  if (!dom) return s;
  const head = u.slice(0, Math.min(2, u.length));
  return head + '•••@' + dom;
};

const Reset = () => {
  /* step: identifier | otp | password | success */
  const [step, setStep]       = useState('identifier');
  const [ident, setIdent]     = useState('');
  const [identErr, setIdentErr] = useState('');
  const [sending, setSending] = useState(false);
  const [rateLimited, setRateLimited] = useState(false);

  /* otp */
  const [otpKey, setOtpKey]   = useState(0);
  const [code, setCode]       = useState('');
  const [otpErr, setOtpErr]   = useState('');
  const [expired, setExpired] = useState(false);
  const [attempts, setAttempts] = useState(MAX_ATTEMPTS);
  const [cooldown, setCooldown] = useState(RESEND_SECS);
  const [verifying, setVerifying] = useState(false);

  /* password */
  const [pw, setPw]   = useState('');
  const [pw2, setPw2] = useState('');

  /* resend cooldown ticker */
  useEffect(() => {
    if (step !== 'otp' || cooldown <= 0) return;
    const t = setInterval(() => setCooldown(c => (c <= 1 ? (clearInterval(t), 0) : c - 1)), 1000);
    return () => clearInterval(t);
  }, [step, cooldown]);

  const validIdent = v => {
    const s = v.trim();
    if (!s) return 'И-мэйл эсвэл утасны дугаараа оруулна уу.';
    const email = /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
    if (!email && !looksLikePhone(s)) return 'И-мэйл эсвэл утасны дугаарын формат буруу байна.';
    return '';
  };

  const sendCode = () => {
    const e = validIdent(ident);
    setIdentErr(e);
    if (e) return;
    // demo: identifier containing "limit" → rate-limited
    if (ident.toLowerCase().includes('limit')) { setRateLimited(true); return; }
    setRateLimited(false);
    setSending(true);
    setTimeout(() => {
      setSending(false);
      setStep('otp');
      setCode(''); setOtpErr(''); setExpired(false); setAttempts(MAX_ATTEMPTS);
      setCooldown(RESEND_SECS); setOtpKey(k => k + 1);
    }, 850);
  };

  const resend = () => {
    if (cooldown > 0) return;
    setCode(''); setOtpErr(''); setExpired(false); setOtpKey(k => k + 1);
    setCooldown(RESEND_SECS);
  };

  const verify = () => {
    if (code.length !== 6 || attempts <= 0) return;
    setVerifying(true);
    setTimeout(() => {
      setVerifying(false);
      if (code === '111111') { setExpired(true); setOtpErr(''); setCode(''); setOtpKey(k=>k+1); return; }
      if (code === '000000') {
        const left = attempts - 1;
        setAttempts(left);
        setCode(''); setOtpKey(k => k + 1);
        setOtpErr(left > 0 ? `Код буруу байна. Үлдсэн оролдлого: ${left}` : '');
        if (left <= 0) setRateLimited(true);
        return;
      }
      setStep('password');
    }, 800);
  };

  const rules = [
    { label:'8+ тэмдэгт',       ok: pw.length >= 8 },
    { label:'1 том үсэг',       ok: /[A-ZА-ЯӨҮ]/.test(pw) },
    { label:'1 тоо',            ok: /\d/.test(pw) },
    { label:'1 тусгай тэмдэгт',  ok: /[^A-Za-zА-Яа-яӨҮөү0-9]/.test(pw) },
  ];
  const allOk = rules.every(r => r.ok);
  const mismatch = pw2.length > 0 && pw !== pw2;
  const pwValid = allOk && pw2.length > 0 && pw === pw2;

  const backToLogin = () => window.location.href = '05 Login.html';

  const mm = String(Math.floor(cooldown/60)).padStart(1,'0');
  const ss = String(cooldown%60).padStart(2,'0');

  return (
    <main style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', padding:'56px 20px 96px', fontFamily:"'Manrope',-apple-system,sans-serif", WebkitFontSmoothing:'antialiased' }}>
      <div style={{ width:'100%', maxWidth:440 }}>

        {/* brand + back link */}
        {step !== 'success' && (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:20 }}>
            <div style={{ display:'flex', alignItems:'center', gap:11 }}>
              <svg width="34" height="34" viewBox="0 0 48 48" fill="none"><path d="M9.6 11.4V28.6L0 34.4V0h9.9L24 8.4 38.1 0H48v5.6L24 20 9.6 11.4z" fill="#FF6B2C"/><path d="M38.4 36.6V19.4L48 13.6V48h-9.9L24 39.6 9.9 48H0v-5.6L24 28l14.4 8.6z" fill="#2D6BFF"/></svg>
              <div style={{ fontWeight:800, fontSize:14.5, lineHeight:1.05, letterSpacing:'-0.01em', color:T.ink }}>Money Market <span style={{ color:T.muted2, fontWeight:600 }}>Fund</span></div>
            </div>
            <a href="05 Login.html" style={{ display:'inline-flex', alignItems:'center', gap:6, color:T.muted, fontSize:13, fontWeight:600, textDecoration:'none' }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
              Нэвтрэх рүү буцах
            </a>
          </div>
        )}

        <div style={{ background:T.surface, border:`1px solid ${T.line}`, borderRadius:24, padding:'36px 32px', boxShadow:'0 24px 64px -28px rgba(11,16,32,.18)' }}>

          {/* ── Step 1 · identifier ── */}
          {step === 'identifier' && (
            <>
              <Intro glyph={LockGlyph} title="Нууц үг сэргээх"
                sub="Бүртгэлтэй и-мэйл эсвэл утасны дугаараа оруулна уу. Бид 6 оронтой баталгаажуулах код илгээнэ."/>

              {rateLimited && (
                <div style={{ marginBottom:18 }}>
                  <WebErrorState variant="warn" title="Хэт олон оролдлого"
                    body="Аюулгүй байдлын үүднээс түр хугацаанд хязгаарлав. 15 минутын дараа дахин оролдоно уу."/>
                </div>
              )}

              <IdentifierInput value={ident} onChange={e => { setIdent(e.target.value); setIdentErr(''); setRateLimited(false); }}
                error={identErr} disabled={sending} onEnter={sendCode}/>

              <div style={{ marginTop:12, display:'flex', alignItems:'flex-start', gap:8, fontSize:12, color:T.muted, lineHeight:1.5 }}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0, marginTop:1 }}><circle cx="12" cy="12" r="9" stroke={T.muted2} strokeWidth="2"/><path d="M12 11v5M12 8h.01" stroke={T.muted2} strokeWidth="2.2" strokeLinecap="round"/></svg>
                <span>Аюулгүй байдлын үүднээс дансны мэдээллийг задлахгүй. Бүртгэлтэй бол код илгээгдэнэ.</span>
              </div>

              <div style={{ marginTop:24 }}>
                <WebButton variant="primary" full disabled={sending || rateLimited} onClick={sendCode}>
                  {sending ? 'Илгээж байна…' : 'Код илгээх'}
                </WebButton>
              </div>

              <div style={{ marginTop:26, padding:'12px 14px', background:T.line2, borderRadius:10 }}>
                <div style={{ fontSize:11.5, fontWeight:700, color:T.muted, marginBottom:4 }}>Демо горим</div>
                <div style={{ fontSize:11.5, color:T.muted, fontWeight:500, lineHeight:1.5 }}>
                  Ямар ч хаяг код руу шилжинэ. Кодонд «<b>000000</b>» = буруу, «<b>111111</b>» = хугацаа дууссан, бусад = амжилттай. Хаягт «<b>limit</b>» = хязгаарлалт.
                </div>
              </div>
            </>
          )}

          {/* ── Step 2 · OTP ── */}
          {step === 'otp' && (
            <>
              <Intro glyph={ShieldGlyph} title="Кодоо оруулна уу"
                sub={<>Хэрэв <b style={{ color:T.text, fontWeight:700 }}>{maskIdentifier(ident)}</b> бүртгэлтэй бол 6 оронтой баталгаажуулах код илгээгдлээ.</>}/>

              {/* calm, no account-existence leak */}
              <div style={{ marginBottom:18, display:'flex', gap:10, alignItems:'flex-start', padding:'12px 14px', borderRadius:12, background:T.indigoSoft, border:`1px solid ${T.indigoBorder}` }}>
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" style={{ flexShrink:0, marginTop:1 }}><circle cx="12" cy="12" r="9" stroke={T.indigo} strokeWidth="1.9"/><path d="M12 11v5M12 8h.01" stroke={T.indigo} strokeWidth="2.2" strokeLinecap="round"/></svg>
                <div style={{ fontSize:12, fontWeight:600, color:T.indigo, lineHeight:1.5 }}>Хэрэв бүртгэлтэй бол код илгээгдлээ. Ирээгүй бол хаягаа шалгаад дахин оролдоно уу.</div>
              </div>

              <WebOTPInput key={otpKey} length={6} onComplete={c => { setCode(c); setOtpErr(''); }}/>

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:12, fontSize:12.5, fontWeight:600, color:T.muted }}>
                <span style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ width:8, height:8, borderRadius:99, background: expired ? T.neg : code.length===6 ? T.pos : T.line, display:'inline-block' }}/>
                  {expired ? 'Кодын хугацаа дууссан' : code.length===6 ? 'Код бэлэн' : (cooldown>0 ? `Код ${mm}:${ss} хүчинтэй` : 'Код хүчингүй болсон')}
                </span>
                <button onClick={resend} disabled={cooldown>0} style={{ color: cooldown>0?T.muted2:T.indigo, fontWeight:700, background:'none', border:'none', cursor:cooldown>0?'default':'pointer', fontFamily:'inherit', fontSize:12.5, padding:0 }}>
                  {cooldown>0 ? `Дахин илгээх (${mm}:${ss})` : 'Дахин илгээх'}
                </button>
              </div>

              {otpErr && (
                <div style={{ marginTop:14 }}><WebErrorState variant="neg" title="Код буруу байна" body={otpErr}/></div>
              )}
              {expired && (
                <div style={{ marginTop:14 }}><WebErrorState variant="warn" title="Кодын хугацаа дууслаа" body="6 оронтой кодын хүчинтэй хугацаа дууссан байна. Дахин код авна уу." action={{ label:'Шинэ код авах', onClick: resend }}/></div>
              )}

              <div style={{ marginTop:22 }}>
                <WebButton variant="primary" full disabled={code.length!==6 || verifying || attempts<=0}
                  reason={code.length!==6 ? '6 оронтой кодоо бүрэн оруулна уу.' : undefined} onClick={verify}>
                  {verifying ? 'Шалгаж байна…' : 'Үргэлжлүүлэх'}
                </WebButton>
              </div>

              <div style={{ marginTop:18, display:'flex', alignItems:'center', gap:8, justifyContent:'center', fontSize:12.5, fontWeight:600, color:T.muted }}>
                Хаяг буруу байна уу?
                <button onClick={() => { setStep('identifier'); setRateLimited(false); }} style={{ color:T.indigo, fontWeight:700, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', fontSize:12.5, padding:0 }}>Өөрчлөх</button>
              </div>
            </>
          )}

          {/* ── Step 3 · new password ── */}
          {step === 'password' && (
            <>
              <Intro glyph={KeyGlyph} title="Шинэ нууц үг үүсгэх"
                sub="Хуучин нууц үгнээс ялгаатай, шинэ нууц үгээ оруулна уу."/>

              <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
                <PwInput label="Шинэ нууц үг" value={pw} onChange={e => setPw(e.target.value)} placeholder="Шинэ нууц үгээ оруулна уу"/>
                <PwInput label="Нууц үг давтах" value={pw2} onChange={e => setPw2(e.target.value)} error={mismatch ? 'Нууц үг таарахгүй байна' : ''} placeholder="Шинэ нууц үгээ давтан оруулна уу"/>
              </div>

              <div style={{ marginTop:18, display:'flex', flexWrap:'wrap', gap:8 }}>
                {rules.map((r,i) => (
                  <div key={i} style={{ display:'inline-flex', alignItems:'center', gap:7, padding:'8px 12px', borderRadius:999, background: r.ok?T.posSoft:T.line2, color: r.ok?T.pos:T.muted, fontSize:12, fontWeight:700, transition:'all .15s' }}>
                    {r.ok
                      ? <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke={T.pos} strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                      : <span style={{ width:11, height:11, borderRadius:999, border:`2px solid ${T.muted2}` }}/>}
                    {r.label}
                  </div>
                ))}
              </div>

              <div style={{ marginTop:24 }}>
                <WebButton variant="primary" full disabled={!pwValid}
                  reason={!pwValid ? (mismatch ? 'Нууц үг хоёулаа таарах ёстой.' : 'Шаардлагыг бүрэн хангана уу.') : undefined}
                  onClick={() => setStep('success')}>Нууц үг шинэчлэх</WebButton>
              </div>
            </>
          )}

          {/* ── Step 4 · success ── */}
          {step === 'success' && (
            <div style={{ textAlign:'center', padding:'8px 0' }}>
              <div style={{ width:80, height:80, borderRadius:999, background:`${T.pos}1A`, display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 24px' }}>
                <div style={{ width:58, height:58, borderRadius:999, background:T.pos, display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 12px 28px -8px ${T.pos}80` }}>
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </div>
              </div>
              <div style={{ fontSize:28, fontWeight:800, color:T.ink, letterSpacing:'-0.02em', marginBottom:10 }}>Нууц үг шинэчлэгдлээ</div>
              <div style={{ fontSize:14, color:T.muted, fontWeight:500, lineHeight:1.6, marginBottom:28 }}>
                Таны нууц үг амжилттай шинэчлэгдлээ. Шинэ нууц үгээрээ дансандаа нэвтэрнэ үү.
              </div>
              <WebButton variant="primary" full onClick={backToLogin}>Нэвтрэх →</WebButton>
            </div>
          )}

        </div>

        <div style={{ marginTop:22, textAlign:'center', fontSize:11.5, color:T.muted2, fontWeight:600, lineHeight:1.7 }}>
          <div>Асуудал гарвал <a href="https://support.mmf.mn" style={{ color:T.muted, fontWeight:700 }}>дэмжлэгийн баг</a>-т хандана уу.</div>
