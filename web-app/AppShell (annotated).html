<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AppShell — annotated · MMF Web App</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<script src="../foundations.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="../comp_atoms.jsx"></script>
<script type="text/babel" src="../comp_kit.jsx"></script>
<style>
  body { margin: 0; background: #EEF0F6; }
  .doc { max-width: 1360px; margin: 0 auto; padding: 40px 32px 80px; }
  .doc-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--indigo); }
  .doc-title { font-size: 34px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); margin: 10px 0 6px; }
  .doc-sub { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 28px; max-width: 640px; line-height: 1.6; }

  /* bounded "screen" that frames the live shell */
  .screen { position: relative; height: 780px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); box-shadow: var(--e-3); background: var(--bg); }
  .screen .skip-link { position: absolute; transform: none; } /* reveal in-context for the annotation */

  /* numbered callout dots overlaid on the shell */
  .pin { position: absolute; z-index: 55; display: flex; align-items: center; gap: 8px; pointer-events: none; }
  .pin--l { flex-direction: row-reverse; }
  .pin__dot { width: 26px; height: 26px; border-radius: 999px; background: var(--indigo); color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px -2px rgba(79,70,229,.6); border: 2px solid #fff; flex-shrink: 0; }
  .pin__tag { font-size: 11px; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; box-shadow: var(--e-1); white-space: nowrap; }

  /* legend */
  .legend { margin-top: 26px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .leg { display: flex; gap: 12px; background: #fff; border: 1px solid var(--line-2); border-radius: 14px; padding: 14px 16px; }
  .leg__n { width: 24px; height: 24px; border-radius: 999px; background: var(--indigo); color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
  .leg__id { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--indigo); }
  .leg__t { font-size: 13.5px; font-weight: 800; color: var(--ink); margin: 2px 0 4px; letter-spacing: -.01em; }
  .leg__b { font-size: 12.5px; font-weight: 500; color: var(--muted); line-height: 1.5; margin: 0; }
  .leg__b code { font-family: var(--font-mono); font-size: 11px; background: var(--line-2); color: var(--ink-2); padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<div class="doc">
  <div class="doc-eyebrow">MMF Web App · Shared AppShell</div>
  <h1 class="doc-title">AppShell — annotated</h1>
  <p class="doc-sub">The shared desktop shell after the audit fixes. Sidebar rail (icons + labels + active pill) is kept exactly as-is; the callouts mark what changed. Tab into the frame to see the skip-link and the R0 focus ring live.</p>

  <div class="screen reveal" id="screen"></div>

  <div class="legend" id="legend"></div>
</div>

<script type="text/babel">
const { WebSidebar, WebTopbar, WebFooter, WebPageHeader } = window;
const C = { ink:'#0B1020', text:'#2A3052', muted:'#6B7191', muted2:'#9099B5', line:'#E7E9F2', line2:'#EFF1F8', indigo:'#4F46E5', pos:'#0E9F6E', neg:'#DC2626' };
const fmt = window.formatMNT;

/* ── representative content — exercises F-01 grid + F-06 logo + §06 cue ── */
function Stat({ label, value, delta, tone }) {
  return (
    <div style={{ background:'#fff', border:`1px solid ${C.line2}`, borderRadius:16, padding:'15px 17px', minWidth:0 }}>
      <div style={{ fontSize:11, fontWeight:700, color:C.muted, textTransform:'uppercase', letterSpacing:'.05em', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{label}</div>
      <div className="num" style={{ fontSize:23, fontWeight:800, color:C.ink, marginTop:8, letterSpacing:'-.02em' }}>{value}</div>
      {delta && <div style={{ fontSize:12, fontWeight:700, color:tone, marginTop:4 }}>{delta}</div>}
    </div>
  );
}

const POS = [
  { L:'К', c:'linear-gradient(135deg,#2D6BFF,#4F46E5)', name:'Капитрон Банк ХК · Хадгаламжийн сертификат', tk:'CAPIT 1450 CD 240227', amt:24500000 },
  { L:'ТД', c:'linear-gradient(135deg,#0E9F6E,#0891B2)', name:'Худалдаа Хөгжлийн Банк · Итгэлцлийн бүтээгдэхүүн', tk:'TDBM 2300 IT 270227', amt:12000000 },
  { L:'ДФ', c:'linear-gradient(135deg,#4F46E5,#7C3AED)', name:'Дарь Финанс ББСБ · Арилжааны бичиг', tk:'DARI 0900 CP 251110', amt:8250000 },
];

function PositionsCard() {
  return (
    <div style={{ background:'#fff', border:`1px solid ${C.line2}`, borderRadius:18, overflow:'hidden' }}>
      <div style={{ padding:'14px 16px', fontSize:14, fontWeight:800, color:C.ink, borderBottom:`1px solid ${C.line2}`, letterSpacing:'-.01em' }}>Миний хөрөнгө оруулалт</div>
      {POS.map((p,i) => (
        <div key={i} style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) auto', gap:14, alignItems:'center', padding:'12px 16px', borderTop:i?`1px solid ${C.line2}`:'none' }}>
          <div style={{ display:'flex', alignItems:'center', gap:12, minWidth:0 }}>
            <span className="issuer-logo" style={{ width:38 }}><span style={{ fontFamily:"'JetBrains Mono',monospace", fontWeight:700, fontSize:13, color:C.indigo }}>{p.L}</span></span>
            <div style={{ minWidth:0 }}>
              <div className="truncate" title={p.name} style={{ fontSize:13.5, fontWeight:700, color:C.ink }}>{p.name}</div>
              <div className="truncate" style={{ fontSize:11, fontWeight:600, color:C.muted2, fontFamily:"'JetBrains Mono',monospace", marginTop:2 }}>{p.tk}</div>
            </div>
          </div>
          <div style={{ textAlign:'right', flexShrink:0 }}>
            <div className="num" style={{ fontSize:14, fontWeight:800, color:C.ink }}>{fmt(p.amt)}</div>
            <span className="dir dir--buy" style={{ marginTop:3, fontSize:11.5 }}>
              <svg className="dir__arrow" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M6 11l6-6 6 6" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"/></svg>Авах
            </span>
          </div>
        </div>
      ))}
    </div>
  );
}

function Rail() {
  const news = [
    { t:'Арилжааны бичгийн анхдагч арилжаа зарлагдлаа', d:'2026.05.15, 14:05' },
    { t:'Дарь Финанс ББСБ шинэ Итгэлцэл гаргалаа', d:'2026.05.14, 09:30' },
  ];
  return (
    <div style={{ background:'#fff', border:`1px solid ${C.line2}`, borderRadius:18, padding:'16px 18px' }}>
      <div style={{ fontSize:13.5, fontWeight:800, color:C.ink, letterSpacing:'-.01em' }}>Мэдээ мэдээлэл</div>
      <div style={{ display:'flex', flexDirection:'column', gap:14, marginTop:14 }}>
        {news.map((n,i) => (
          <div key={i} style={{ minWidth:0 }}>
            <div style={{ fontSize:12.5, fontWeight:700, color:C.text, lineHeight:1.4 }}>{n.t}</div>
            <div style={{ fontSize:11, fontWeight:600, color:C.muted2, fontFamily:"'JetBrains Mono',monospace", marginTop:5 }}>{n.d}</div>
          </div>
        ))}
      </div>
      <a className="ext-link" href="https://frc.mn" target="_blank" rel="noopener noreferrer" style={{ marginTop:16, fontSize:12.5 }}>
        СЗХ мэдээлэл<svg className="ext-link__icon" viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M9 7h8v8" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
      </a>
    </div>
  );
}

/* ── the shell, composed inside the bounded screen ── */
function Shell() {
  return (
    <>
      <a href="#mmf-main" className="skip-link" style={{ left:16, top:14, whiteSpace:'nowrap' }}>Үндсэн хэсэг рүү очих</a>
      <div style={{ display:'flex', height:'100%' }}>
        <div style={{ height:'100%', overflow:'hidden', flexShrink:0 }}><WebSidebar activePath="/dashboard"/></div>
        <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', height:'100%' }}>
          <WebTopbar title="Миний самбар" notifCount={2} defaultMenuOpen={true}/>
          <main id="mmf-main" tabIndex={-1} style={{ flex:1, minHeight:0, overflow:'auto', padding:'26px 32px', outline:'none' }}>
            <WebPageHeader title="Миний самбар" subtitle="Хөрөнгө оруулалтын тойм · 2026.05.15, 14:05"/>
            <div className="app-grid">
              <div style={{ minWidth:0, display:'flex', flexDirection:'column', gap:16 }}>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,minmax(0,1fr))', gap:12 }}>
                  <Stat label="Нийт үлдэгдэл" value={fmt(44750000)} delta="+₮ 1,240,000" tone={C.pos}/>
                  <Stat label="Идэвхтэй хөрөнгө" value="3" delta="Бүгд хэвийн" tone={C.muted}/>
                  <Stat label="Дундаж өгөөж" value="14.5% жилийн" delta="+0.4%" tone={C.pos}/>
                </div>
                <PositionsCard/>
              </div>
              <div style={{ minWidth:0 }}><Rail/></div>
            </div>
          </main>
          <WebFooter/>
        </div>
      </div>
    </>
  );
}

/* ── numbered pins over the screen ── */
const PINS = [
  { n:1, style:{ left:150, top:100 }, tag:'F-02 · «ҮНДСЭН»' },
  { n:2, style:{ right:36, top:16 }, l:true, tag:'Нэр + аватар · и-мэйл цэсэнд' },
  { n:3, style:{ left:214, top:16 }, tag:'F-24 · Skip link + focus ring' },
  { n:4, style:{ left:'40%', top:150 }, tag:'F-01 · Fluid grid' },
  { n:5, style:{ left:150, bottom:14 }, tag:'F-23 · Footer' },
];
function Pins() {
  return PINS.map(p => (
    <div key={p.n} className={'pin' + (p.l ? ' pin--l' : '')} style={p.style}>
      <span className="pin__dot">{p.n}</span>
      <span className="pin__tag">{p.tag}</span>
    </div>
  ));
}

ReactDOM.createRoot(document.getElementById('screen')).render(<><Shell/><Pins/></>);

/* ── legend ── */
const LEG = [
  { n:1, id:'F-02', t:'Sidebar бүлгийн шошго → «ҮНДСЭН»', b:'"HYYP" нь Кирилл/Латин холимог, утгагүй уншигддаг байсныг сольсон. Icons + labels рэйл болон идэвхтэй pill-ийг аудитын дагуу яг хэвээр үлдээв.' },
  { n:2, id:'Topbar', t:'Нэр + аватар; и-мэйл dropdown дотор', b:'Баруун дээд талд хэрэглэгчийн нэр + аватар. Түүхий ALL-CAPS и-мэйл хэзээ ч мөрөнд харагдахгүй — и-мэйл нь зөвхөн нээгддэг цэсний толгойд (mono).' },
  { n:3, id:'F-24', t:'Skip-to-content + R0 focus ring', b:'Tab дарахад зүүн дээд буланд "Үндсэн хэсэг рүү очих" линк гарна. Sidebar мөр, тохиргооны араа, аватар цэс болон цэсний мөр бүр R0 (2px indigo, 2px offset) фокус цагиргтай — dropdown фокус занга зассан.' },
  { n:4, id:'F-01', t:'Контент талбар R0 fluid grid', b:'Контентын хэсэг <code>minmax(0,1fr) 320px</code>; хүүхэд бүр <code>min-width:0</code>, урт нэр ellipsis + title-аар таслагдана — 1280 / 1366 / 1440 / 1600 / 1920 дээр хэвтээ гүйлт үүсэхгүй.' },
  { n:5, id:'F-23', t:'Footer нэг мөр', b:'Үйлчилгээний нөхцөл · Нууцлалын бодлого · Холбоо барих · Тусламж · СЗХ тусгай зөвшөөрлийн № [placeholder]. Нэг эгнээ, бүдэг өнгө.' },
];
document.getElementById('legend').innerHTML = LEG.map(l =>
  `<div class="leg"><span class="leg__n">${l.n}</span><div><div class="leg__id">${l.id}</div><div class="leg__t">${l.t}</div><p class="leg__b">${l.b}</p></div></div>`
).join('');
</script>
</body>
</html>
